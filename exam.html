<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="shared/favicon.svg">
    <title>Motor City Math — Exam</title>
    <link rel="stylesheet" href="shared/katex/katex.min.css">
    <script src="shared/katex/katex.min.js"></script>
    <script src="shared/katex/auto-render.min.js"></script>
    <link rel="stylesheet" href="shared/styles.css">
    <link rel="stylesheet" href="shared/print.css" media="print">
    <style>
        .exam-container { max-width: 800px; margin: 0 auto; padding: 16px; }
        .exam-subtitle { text-align: center; color: var(--text-secondary); font-size: var(--text-sm); margin: -8px 0 16px; }
        .question-card { background: var(--bg-card); border: 1px solid var(--border-default); border-left: none; border-radius: 8px; padding: 20px 20px 20px 24px; margin-bottom: 16px; position: relative; box-shadow: var(--shadow-card); transition: border-color 0.2s; }
        .question-card.answered { border-color: var(--accent-blue); }
        .question-header { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; padding-bottom: 10px; border-bottom: 2px solid var(--border-subtle); }
        .question-number { font-weight: 800; color: var(--accent-navy); font-size: var(--text-base); letter-spacing: 0.05em; }
        .standard-badge { background: var(--bg-highlight); color: var(--accent-blue); font-size: var(--text-xs); font-weight: 700; padding: 2px 8px; border-radius: 12px; }
        .input-group { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin: 10px 0; }
        .input-group label { font-weight: 600; color: var(--text-primary); min-width: 120px; }
        .input-group input[type="number"], .input-group input[type="text"], .input-group select { padding: 8px 12px; border: 1px solid var(--border-default); border-radius: 6px; font-size: var(--text-base); background: var(--bg-input); color: var(--text-primary); width: 120px; }
        .input-group select { width: 220px; font-size: 1rem; padding: 10px 14px; min-height: 42px; cursor: pointer; }


        .radio-group { margin: 10px 0; }
        .radio-option { display: flex; align-items: center; gap: 8px; padding: 8px 12px; margin: 4px 0; border: 1px solid var(--border-subtle); border-radius: 6px; cursor: pointer; background: var(--bg-input); }
        .radio-option:hover { border-color: var(--accent-blue); }
        .radio-option input[type="radio"] { accent-color: var(--accent-blue); }
        .radio-option label { cursor: pointer; flex: 1; color: var(--text-primary); }
        .answer-feedback { display: none; padding: 8px 12px; border-radius: 6px; margin-top: 8px; font-weight: 600; font-size: var(--text-sm); }
        .answer-feedback.show { display: block; }
        .answer-feedback.correct { background: rgba(27,125,58,0.1); color: var(--color-correct); }
        .answer-feedback.incorrect { background: rgba(200,16,46,0.1); color: var(--color-incorrect); }
        .hint-layers { margin-top: 10px; }
        .hint-btn { background: var(--bg-highlight); color: var(--accent-blue); border: 1px solid var(--border-subtle); border-radius: 6px; padding: 6px 14px; cursor: pointer; font-size: var(--text-sm); margin: 4px 4px 4px 0; }
        .hint-btn:hover { background: var(--accent-blue); color: white; }
        .hint-layer { display: none; background: var(--bg-highlight); border: 1px solid var(--border-subtle); border-radius: 6px; padding: 12px; margin-top: 8px; font-size: var(--text-sm); color: var(--text-primary); }
        .hint-layer.show { display: block; }
        /* Graph */
        .graph-container { text-align: center; margin: 12px 0; position: relative; }
        /* Box Method Grid */
        .box-grid-wrap { margin: 14px 0 8px; overflow-x: auto; }
        .box-grid { border-collapse: collapse; margin: 0 auto; }
        .box-grid th, .box-grid td { border: 2px solid var(--accent-navy); min-width: 64px; min-height: 52px; text-align: center; padding: 6px 8px; }
        .box-corner { background: transparent; border: none !important; }
        .box-header { background: var(--bg-highlight); font-weight: 700; color: var(--accent-navy); font-size: var(--text-base); }
        .box-header-unknown { color: var(--text-secondary); font-weight: 400; font-style: italic; }
        .box-cell { background: var(--bg-card); vertical-align: middle; }
        .box-header-input { background: var(--bg-highlight); padding: 4px; }
        .box-header-input .box-input { width: 70px; text-align: center; }
        .box-cell-scratch { background: var(--bg-card); }
        .box-input { width: 80px; border: 1px solid var(--border-default); border-radius: 4px; padding: 4px 6px; font-size: var(--text-sm); background: var(--bg-input); color: var(--text-primary); text-align: center; }
        .box-input:focus { outline: 2px solid var(--accent-blue); border-color: var(--accent-blue); }
        .box-reverse-stmt { text-align: center; font-size: var(--text-base); margin-bottom: 10px; color: var(--text-primary); }

        .graph-container canvas { border: 1px solid var(--border-default); border-radius: 4px; max-width: 100%; cursor: crosshair; }
        .graph-controls { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin: 8px 0; }
        .graph-btn { padding: 6px 14px; border: 1px solid var(--border-default); border-radius: 6px; background: var(--bg-input); color: var(--text-primary); cursor: pointer; font-size: var(--text-sm); font-weight: 600; }
        .graph-btn:hover { border-color: var(--accent-blue); }
        .graph-btn.active { background: var(--accent-blue); color: white; border-color: var(--accent-blue); }
        .graph-btn.check-graph { background: transparent; color: var(--accent-navy); border-color: var(--accent-navy); font-weight: 700; }
        .graph-btn.check-graph:disabled { opacity: 0.5; cursor: not-allowed; }
        .graph-counter { text-align: center; color: var(--text-secondary); font-size: var(--text-sm); margin: 4px 0; }
        .graph-result { display: none; text-align: center; font-weight: 700; padding: 8px; border-radius: 6px; margin: 8px 0; }
        .graph-result.show { display: block; }
        .graph-result.correct { background: rgba(27,125,58,0.1); color: var(--color-correct); }
        .graph-result.incorrect { background: rgba(200,16,46,0.1); color: var(--color-incorrect); }
        .graph-tooltip { position: fixed; background: var(--accent-navy); color: white; padding: 3px 8px; border-radius: 4px; font-size: var(--text-xs); pointer-events: none; display: none; z-index: 100; }
        /* Scorecard */
        .scorecard { background: var(--bg-card); border: 2px solid var(--accent-blue); border-radius: 12px; padding: 24px; margin: 24px 0; text-align: center; box-shadow: var(--shadow-card); }
        .scorecard h2 { color: var(--text-primary); margin: 0 0 8px; }
        .scorecard .score-big { font-size: var(--text-2xl); font-weight: 900; color: var(--accent-navy); }
        @keyframes grade-a-flash { 0%,100%{background:transparent} 50%{background:rgba(63,185,80,0.18)} }
        .grade-a-flash { animation: grade-a-flash 0.6s ease 1; }
        @media (prefers-reduced-motion: reduce) { .grade-a-flash { animation: none; background: rgba(63,185,80,0.18); } }
        .scorecard .score-pct { font-size: var(--text-lg); color: var(--text-secondary); margin: 4px 0 12px; }
        .saas-grade { display: inline-block; padding: 6px 20px; border-radius: 20px; font-weight: 800; font-size: var(--text-lg); color: white; }
        .saas-grade.g4 { background: var(--color-correct); }
        .saas-grade.g3 { background: var(--accent-blue); }
        .saas-grade.g2 { background: var(--color-warning); }
        .saas-grade.g1 { background: var(--color-incorrect); }
        .standards-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 8px; margin: 16px 0; text-align: left; }
        .std-card { background: var(--bg-highlight); border-radius: 8px; padding: 10px 14px; }
        .std-card .std-name { font-weight: 700; color: var(--text-primary); font-size: var(--text-sm); }
        .std-card .std-score { color: var(--text-secondary); font-size: var(--text-sm); }
        .submit-area { text-align: center; margin: 24px 0; }
        .submit-warning { background: rgba(249,115,22,0.12); border: 1px solid rgba(249,115,22,0.4); color: var(--text-primary); border-radius: 8px; padding: 12px 16px; margin-bottom: 14px; font-size: var(--text-sm); text-align: left; }
        .error-msg { text-align: center; padding: 40px; color: var(--color-incorrect); font-size: var(--text-lg); }
        /* Progress bar — ADHD: show progress position */
        .progress-strip {
            position: sticky;
            top: 0;
            z-index: 50;
            background: var(--bg-card);
            border-bottom: 1px solid var(--border-subtle);
            padding: 8px 16px;
            display: none;
            align-items: center;
            gap: 12px;
            font-size: var(--text-sm);
            color: var(--text-secondary);
            box-shadow: 0 2px 8px rgba(0,45,98,0.06);
        }
        .progress-strip.active { display: flex; }
        .progress-bar { flex: 1; height: 6px; background: var(--border-subtle); border-radius: 3px; overflow: hidden; }
        .progress-fill { height: 100%; background: var(--accent-blue); border-radius: 3px; transition: width 0.3s ease; }
        @media (prefers-reduced-motion: reduce) { .progress-fill { transition: none; } }
        .progress-text { font-weight: 600; white-space: nowrap; }
        .exam-picker { text-align: center; padding: 24px 0; }
        .exam-picker p { color: var(--text-secondary); font-size: var(--text-base); margin-bottom: 20px; }
        .exam-picker-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; max-width: 600px; margin: 0 auto; }
        .exam-picker-card { display: block; text-decoration: none; background: var(--bg-card); border: 1px solid var(--border-default); border-radius: 8px; padding: 16px; text-align: left; position: relative; box-shadow: var(--shadow-card); transition: border-color 0.15s, box-shadow 0.15s; }
        .exam-picker-card::before { content: ''; position: absolute; top: 0; left: 0; width: 4px; height: 100%; border-radius: 8px 0 0 8px; background: linear-gradient(to bottom, var(--accent-red), var(--accent-blue), var(--accent-red)); }
        .exam-picker-card:hover { border-color: var(--accent-blue); box-shadow: 0 2px 12px rgba(0,45,98,0.12); }
        .exam-picker-card .card-title { font-weight: 700; color: var(--text-primary); font-size: var(--text-base); margin-bottom: 4px; }
        .exam-picker-card .card-desc { color: var(--text-secondary); font-size: var(--text-sm); }
        /* WCAG 2.4.7: visible focus indicator */
        :focus-visible { outline: 2px solid var(--border-focus, var(--accent-blue-on-dark)); outline-offset: 2px; }


        /* Correct-answer pulse (320ms, ADHD dopamine window) */
        @keyframes correct-pulse {
            0%   { box-shadow: 0 0 0 0px rgba(63,185,80,0); }
            40%  { box-shadow: 0 0 0 5px rgba(63,185,80,0.35); }
            100% { box-shadow: 0 0 0 0px rgba(63,185,80,0); }
        }
        .correct-pulse { animation: correct-pulse 320ms ease-out forwards; }
        @media (prefers-reduced-motion: reduce) { .correct-pulse { animation: none !important; } }
        /* Sticky question tracker */
        #questionTracker {
            position: sticky; top: 0; z-index: 100;
            padding: 6px 16px; font-size: var(--text-sm); color: var(--text-secondary);
            background: var(--bg-page); box-shadow: 0 4px 8px rgba(0,0,0,0.15);
            text-align: right; border-bottom: 1px solid var(--border-subtle); display: none;
        }
        @media (max-width: 480px) { #questionTracker { padding: 4px 12px; } }
        @keyframes tracker-all-done { 0% { background: var(--bg-page); } 50% { background: var(--color-correct, #3FB950); color: white; } 100% { background: var(--bg-page); } }
        .tracker-all-done { animation: tracker-all-done 200ms ease-out; }
        @media (prefers-reduced-motion: reduce) { .tracker-all-done { animation: none; } }
        /* Post-wrong nudge */
        .wrong-nudge {
            font-size: var(--text-sm); color: var(--text-secondary);
            margin: 8px 0 0; opacity: 0;
            animation: nudge-in 0.4s ease 2s forwards;
        }
        @keyframes nudge-in { to { opacity: 1; } }
        @media (prefers-reduced-motion: reduce) { .wrong-nudge { animation: none; opacity: 1; } }
        /* Scorecard progressive disclosure */
        #gamePlanSection { animation: fadeIn 0.3s ease; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        @media (prefers-reduced-motion: reduce) { #gamePlanSection { animation: none; } }
        #gameplanBtn { margin-top: 16px; font-size: var(--text-sm); }
        #gameplanBtn[disabled] { cursor: default; }
        @media print { .hint-btn, .graph-controls, .submit-area, .nav-bar, .header-back, .progress-strip, .progress-bar { display: none !important; } }
    </style>
</head>
<body>
    <script>if(localStorage.getItem('mcm-arena-mode')==='on')document.body.classList.add('arena-mode');</script>
    <a href="#questionsContainer" class="skip-link">Skip to questions</a>
    <div class="exam-container" role="main">
        <div class="print-header">
            <strong>Motor City Math — Practice Test</strong><br>
            Name: _____________________ Date: ___________
        </div>
        <header class="test-header">
            <a href="index.html" class="header-back" aria-label="Back to dashboard">←</a>
            <h1 id="examTitle"></h1>
            <div class="header-actions">
                <button onclick="printExam()" class="print-btn">🖨️ Print</button>
            </div>
        </header>
        <p class="subtitle exam-subtitle" id="examSubtitle"></p>


        <div class="progress-strip" id="progressStrip">
            <div class="progress-text" id="progressText">0 / 15</div>
            <div class="progress-bar" role="progressbar" aria-label="Exam progress" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
        </div>

        <div id="questionTracker" aria-live="polite" aria-label="Question position"></div>

        <div id="questionsContainer"></div>

        <div class="submit-area" id="submitArea" style="display:none;">
            <button class="btn-primary" onclick="gradeExam()">📝 SUBMIT & GRADE</button>
        </div>

        <div id="scorecard" style="display:none;"></div>

        <div style="text-align:center; margin: 16px 0;">
            <a href="index.html" class="nav-btn ghost" style="text-decoration:none;">← Back to Dashboard</a>
        </div>
        <div class="footer" style="text-align:center; color:var(--text-secondary); font-size:var(--text-sm); padding:10px 0;">Built with <span aria-hidden="true">💪🏾</span> by Dad · Motor City Math</div>
    </div>

    <script src="shared/scripts.js"></script>
    <script src="config.js"></script>
    <script>
    /* ========== EXAM RENDERER ==========
     * Data model: docs/data-model.md (RP JSON schema, all fields, input contracts)
     * Architecture: docs/architecture.md (system overview, agent file ownership)
     * localStorage: 'mcm_scores'[mcm-{exam_id}] = { attempts[], best{} }
     * sessionStorage: 'exam-autosave-{examId}' (tab-scoped, cleared on submit)
     * ===================================== */
    var examData = null;
    var examId = new URLSearchParams(window.location.search).get('file') || 'unknown';

    /**
     * Pure grade computation. Grade thresholds: 92+=4, 82+=3, 70+=2, <70=1.
     * Single source of truth -- used by showScorecard() and saveResults().
     * Verified exhaustively by exam-hint-scorecard.test.js (101-point coverage).
     * @param {number} pct - Integer percentage 0-100
     * @returns {number} Grade 1-4
     */
    function getGrade(pct) {
        return pct >= 92 ? 4 : pct >= 82 ? 3 : pct >= 70 ? 2 : 1;
    }

    var _autosaveTimer = null;
    /** Debounce-saves all current input values to sessionStorage (800ms delay). */
    function autosave() {
        clearTimeout(_autosaveTimer);
        // 800ms debounce: balances data safety with not hammering sessionStorage on each keystroke
        _autosaveTimer = setTimeout(function() {
            if (!examData) return;
            var state = {};
            try {
                examData.questions.forEach(function(q) {
                    (q.inputs || []).forEach(function(inp) {
                        if (inp.type === 'radio') {
                            var el = document.querySelector('input[name="' + inp.id + '"]:checked');
                            state[inp.id] = el ? el.value : '';
                        } else {
                            var el = document.getElementById(inp.id);
                            state[inp.id] = el ? el.value : '';
                        }
                    });
                });
                sessionStorage.setItem('exam-autosave-' + examId, JSON.stringify(state));
            } catch(e) { /* sessionStorage full or unavailable */ }
        }, 800);
    }

    /** Restores autosaved input values from sessionStorage to the exam form. Shows restore toast if answers found. */
    function restoreAutosave() {
        try {
            var saved = sessionStorage.getItem('exam-autosave-' + examId);
            if (!saved) return;
            var state = JSON.parse(saved);
            var restoredCount = 0;
            examData.questions.forEach(function(q) {
                q.inputs.forEach(function(inp) {
                    if (inp.type === 'radio') {
                        if (state[inp.id]) {
                            var el = document.getElementById(inp.id + '_' + state[inp.id]);
                            if (el) { el.checked = true; restoredCount++; }
                        }
                    } else {
                        var el = document.getElementById(inp.id);
                        if (el && state[inp.id]) { el.value = state[inp.id]; restoredCount++; }
                    }
                });
            });
            if (restoredCount > 0) showRestoreToast(restoredCount);
        } catch(e) { /* parse error */ }
    }

    /** Shows session restore toast per GD spec sw-10: fixed top-right, slide-in, 3000ms auto-dismiss. */
    function showRestoreToast(count) {
        var el = document.createElement('div');
        el.id = 'restore-toast';
        el.setAttribute('role', 'status');
        el.setAttribute('aria-live', 'polite');
        el.className = 'session-restore-toast';
        el.innerHTML = '\uD83D\uDD04 Progress restored. Pick up where you left off.' +
            '<button class="restore-toast-close" aria-label="Dismiss progress restored notice" onclick="(function(e){var t=document.getElementById(\'restore-toast\');if(t)t.remove();})()">\u00D7</button>';
        document.body.appendChild(el);
        var prefersReduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        if (!prefersReduced) el.classList.add('session-restore-toast--slide');
        setTimeout(function() { if (el.parentNode) el.parentNode.removeChild(el); }, 3000);
    }
    var graphData = {};
    var examGraded = false;
    var attemptCounts = {}; // per-question wrong-answer attempt counter (session only)

    // Canvas drawing constants
    var CANVAS = {
        bg: '#FFFFFF', gridMajor: '#B0B8C8', gridMinor: '#D0D5E0',
        axis: '#002D62', label: '#002D62', blue: '#1D42BA',
        correct: '#1B7D3A', incorrect: '#C8102E', pointStroke: '#FFFFFF'
    };

    /* --- URL Param + JSON Loader --- */
    (function() {
        var params = new URLSearchParams(window.location.search);
        var file = params.get('file') || params.get('exam');
        if (!file) {
            document.getElementById('examTitle').textContent = 'Pick Your Challenge 🏀';
            document.getElementById('examSubtitle').textContent = 'Choose a test below to get started';
            var FALLBACK_EXAMS = [
                { id: 'retake-practice-1', title: 'Retake Practice 1', desc: '15 questions · Nonlinear Functions' },
                { id: 'retake-practice-2', title: 'Retake Practice 2', desc: '15 questions · Nonlinear Functions' },
                { id: 'retake-practice-3', title: 'Retake Practice 3', desc: '15 questions · Nonlinear Functions' },
                { id: 'retake-practice-4', title: 'Retake Practice 4', desc: '15 questions · Nonlinear Functions' },
                { id: 'retake-practice-5', title: 'Retake Practice 5', desc: '15 questions · Nonlinear Functions' },
                { id: 'retake-practice-6', title: 'Retake Practice 6 (W2.b Drill)', desc: '15 questions · W2.b Intercepts' },
                { id: 'retake-practice-7', title: 'Retake Practice 7 (Mock Retake)', desc: '15 questions · Full Mock' },
                { id: 'retake-practice-8', title: 'Retake Practice 8', desc: '15 questions · Nonlinear Functions' },
                { id: 'retake-practice-9', title: 'Retake Practice 9', desc: '15 questions · Nonlinear Functions' },
                { id: 'retake-practice-10', title: 'Retake Practice 10', desc: '15 questions · Nonlinear Functions' }
            ];
            function renderPicker(exams) {
                var cards = exams.map(function(e) {
                    return '<a class="exam-picker-card" href="exam.html?file=' + e.id + '"><div class="card-title">' + e.title + '</div><div class="card-desc">' + e.desc + '</div></a>';
                }).join('');
                document.getElementById('questionsContainer').innerHTML =
                    '<div class="exam-picker">' +
                    '<div class="exam-picker-grid">' + cards + '</div>' +
                    '<p style="margin-top:20px;"><a href="index.html" class="btn-ghost">← Back to Dashboard</a></p>' +
                    '</div>';
            }
            if (typeof fetch === 'function' && window.location.protocol !== 'file:') {
                fetch('data/manifest.json').then(function(r) { return r.json(); }).then(function(m) {
                    renderPicker(m.exams || FALLBACK_EXAMS);
                }).catch(function() { renderPicker(FALLBACK_EXAMS); });
            } else {
                renderPicker(FALLBACK_EXAMS);
            }
            return;
        }

        var url = 'data/' + file + '.json';

        function showLoadError(msg, hideRetry) {
            document.getElementById('questionsContainer').innerHTML =
                '<div class="error-msg">' +
                '<p style="margin:0 0 16px">' + msg + '</p>' +
                '<a href="exam.html" class="btn-ghost" style="display:inline-block;margin-right:10px">← Pick a different test</a>' +
                (hideRetry ? '' : '<button onclick="location.reload()" style="padding:8px 18px;border:1px solid var(--border-default);border-radius:6px;background:var(--bg-input);color:var(--text-primary);cursor:pointer;font-size:var(--text-sm)">Try again</button>') +
                '</div>';
        }

        // Fetch with file:// fallback
        if (typeof fetch === 'function' && window.location.protocol !== 'file:') {
            fetch(url).then(function(r) {
                if (r.status === 404) throw new Error('404');
                if (!r.ok) throw new Error('status:' + r.status);
                return r.json();
            }).then(loadExam).catch(function(e) {
                var msg = e && e.message === '404'
                    ? 'Exam not found. Back to the dashboard.'
                    : e && e.message && e.message.indexOf('status:') === 0
                        ? "Server's down. Refresh or try a different exam."
                        : "Can't reach this test. Connection dropped. Refresh and try again.";
                showLoadError(msg);
            });
        } else {
            var xhr = new XMLHttpRequest();
            xhr.open('GET', url, true);
            xhr.onload = function() {
                if (xhr.status === 200 || xhr.status === 0) {
                    try { loadExam(JSON.parse(xhr.responseText)); } catch(e) {
                        showLoadError('This exam has a data error. Try a different one or reload.', true);
                    }
                } else if (xhr.status === 404) {
                    showLoadError('Exam not found. Back to the dashboard.', true);
                } else {
                    showLoadError('Server error (' + xhr.status + '). Refresh or pick a different exam.');
                }
            };
            xhr.onerror = function() {
                showLoadError("Connection dropped. Refresh and try again.");
            };
            xhr.send();
        }
    })();

    /* Curriculum title: "Unit X: Topic — Standards" (Task 12) */
    function formatCurriculumTitle(data) {
        var title = data.title || '';
        var subtitle = data.subtitle || '';
        var stdMatch = subtitle.match(/Standards?\s+([^·]+)/);
        var standards = stdMatch ? stdMatch[1].trim() : '';
        var parts = title.split(/\s*—\s*/);
        if (parts.length === 2 && standards) {
            var unitMatch = parts[0].match(/(Unit\s+\d+)/);
            var unit = unitMatch ? unitMatch[1] : parts[0];
            return unit + ': ' + parts[1] + ' — ' + standards;
        }
        return title;
    }

    /**
     * Initialise the exam from parsed JSON data.
     * @param {Object} data - Parsed exam JSON (exam_id, title, questions, time_minutes, etc.)
     */
    function loadExam(data) {
        examData = data;
        // Curriculum-based title: "Unit X: Topic — Standards" (Task 12)
        var displayTitle = formatCurriculumTitle(data);
        document.title = displayTitle + ' — Motor City Math';
        document.getElementById('examTitle').textContent = displayTitle;
        document.getElementById('examSubtitle').textContent = data.subtitle || '';

        // State 5: empty questions guard
        if (!data.questions || data.questions.length === 0) {
            showLoadError('No questions loaded yet. Pick a different exam.', true);
            return;
        }

        // Show answer format guide if exam has any number inputs
        var hasNumberInputs = data.questions.some(function(q) {
            return q.inputs && q.inputs.some(function(i) { return i.type === 'number'; });
        });
        if (hasNumberInputs) {
            var guide = document.getElementById('answerFormatGuide');
            if (guide) guide.style.display = '';
        }

        // Timer: set data-time-minutes on header for shared/scripts.js timer
        if (data.time_minutes) {
            document.querySelector('.test-header').setAttribute('data-time-minutes', data.time_minutes);
            if (typeof initTimer === 'function') initTimer();
        }

        renderQuestions(data.questions);
        restoreAutosave();
        // Delegated autosave listener
        document.getElementById('questionsContainer').addEventListener('input', autosave);
        document.getElementById('questionsContainer').addEventListener('change', autosave);
        document.getElementById('submitArea').style.display = '';

        // Question position tracker (ADHD: orientation, WCAG 1.3.1)
        (function() {
            var tracker = document.getElementById('questionTracker');
            var qEls = document.getElementById('questionsContainer').querySelectorAll('.question-card');
            if (tracker && qEls.length > 1) {
                window.mcmAnsweredCount = window.mcmAnsweredCount || 0;
                var total = qEls.length;
                function updateTrackerDisplay(idx) {
                    var done = window.mcmAnsweredCount;
                    var doneStr = done >= total ? ' \u2022 All done!' : (done > 0 ? ' \u2022 ' + done + ' done' : '');
                    tracker.textContent = 'Q' + idx + ' of ' + total + doneStr;
                    tracker.setAttribute('aria-label', 'Question ' + idx + ' of ' + total + '. ' + done + ' questions answered.');
                }
                window.mcmUpdateTrackerDisplay = updateTrackerDisplay;
                window.mcmTrackerCurrentQ = 1;
                updateTrackerDisplay(1);
                tracker.style.display = '';
                var io = new IntersectionObserver(function(entries) {
                    entries.forEach(function(e) {
                        if (e.isIntersecting) {
                            var idx = Array.prototype.indexOf.call(qEls, e.target) + 1;
                            window.mcmTrackerCurrentQ = idx;
                            updateTrackerDisplay(idx);
                        }
                    });
                }, { rootMargin: '-20% 0px -60% 0px', threshold: 0 });
                qEls.forEach(function(el) { io.observe(el); });
            }
        })();

        // Render KaTeX after DOM is populated
        if (typeof renderMathInElement === 'function') {
            renderMathInElement(document.body, {
                delimiters: [
                    {left: '\\(', right: '\\)', display: false},
                    {left: '\\[', right: '\\]', display: true}
                ]
            });
        }

        // Initialize progress tracking
        initProgress(data.questions.length);
    }

    /* --- Question Renderer --- */
    /** Render all question cards into #questionsContainer. @param {Array} questions */
    function renderQuestions(questions) {
        var container = document.getElementById('questionsContainer');
        var html = '';

        questions.forEach(function(q) {
            html += '<div class="question-card" id="card-' + q.id + '">';
            html += '<div class="question-header">';
            html += '<span class="question-number">Question ' + q.number + '</span>';
            html += '<span class="standard-badge">' + q.standard + '</span>';
            html += '</div>';
            html += '<div class="question-text">' + (q.question_html || '') + '</div>';

            // Graph canvas (if present)
            if (q.graph) {
                html += renderGraph(q);
            }

            // Box method grid (if present)
            if (q.type === 'box' && q.box) {
                html += renderBoxGrid(q);
            } else if (q.type === 'box-reverse' && q.box) {
                html += renderBoxReverse(q);
            }

            // Input fields — skip cell inputs for box questions (already rendered in grid)
            var skipIds = {};
            if ((q.type === 'box' || q.type === 'box-reverse') && q.box && q.box.cells) {
                (q.box.cells || []).forEach(function(c) { skipIds[c.input_id] = true; });
            }
            (q.inputs || []).forEach(function(inp) {
                if (skipIds[inp.id]) return;
                html += renderInput(inp, q);
            });

            // Feedback area
            html += '<div class="answer-feedback" id="feedback-' + q.id + '" role="alert" aria-live="assertive" aria-atomic="true"></div>';

            // Hint layers
            html += '<div class="hint-layers" id="hints-' + q.id + '" style="display:none;">';
            html += '<button class="hint-btn" id="hintBtn-' + q.id + '-1" aria-expanded="false" onclick="showHint(\'' + q.id + '\', 1)"><span aria-hidden="true">💡</span> HINT</button>';
            html += '<div class="hint-layer" id="hint-' + q.id + '-1">' + (q.hint || '') + '</div>';
            html += '<button class="hint-btn" id="hintBtn-' + q.id + '-2" style="display:none;" onclick="showHint(\'' + q.id + '\', 2)"><span aria-hidden="true">📖</span> SHOW ANSWER</button>';
            html += '<div class="hint-layer" id="hint-' + q.id + '-2"></div>';
            html += '<button class="hint-btn" id="hintBtn-' + q.id + '-3" style="display:none;" onclick="showHint(\'' + q.id + '\', 3)"><span aria-hidden="true">📝</span> SOLUTION STEPS</button>';
            html += '<div class="hint-layer" id="hint-' + q.id + '-3"></div>';
            html += '</div>';

            html += '</div>'; // end question-card
        });

        container.innerHTML = html;

        // Init graph canvases after DOM is built
        questions.forEach(function(q) {
            if (q.graph) initGraph(q.graph.canvas_id, q.graph);
        });
    }

    /**
     * Renders an HTML input element for a question input descriptor.
     * Dispatches on inp.type: 'dropdown', 'number', 'radio'.
     * @param {Object} inp - Input descriptor (id, type, label, options, answer, tolerance)
     * @param {Object} q - Parent question object
     * @returns {string} HTML string for the input element
     */
    function renderInput(inp, q) {
        var html = '';
        if (inp.type === 'dropdown') {
            html += '<div class="input-group">';
            if (inp.label) html += '<label for="' + inp.id + '">' + inp.label + '</label>';
            html += '<select id="' + inp.id + '">';
            html += '<option value="">— Select —</option>';
            (inp.options || []).forEach(function(opt) {
                html += '<option value="' + opt + '">' + opt + '</option>';
            });
            html += '</select></div>';
        } else if (inp.type === 'number') {
            html += '<div class="input-group">';
            if (inp.label) html += '<label for="' + inp.id + '">' + inp.label + '</label>';
            html += '<input type="text" inputmode="decimal" id="' + inp.id + '" aria-describedby="feedback-' + (q ? q.id : inp.id) + '" autocomplete="off">';
            html += '</div>';
        } else if (inp.type === 'radio') {
            html += '<div class="radio-group">';
            if (inp.label) html += '<div style="font-weight:600; margin-bottom:6px; color:var(--text-primary);">' + inp.label + '</div>';
            (inp.options || []).forEach(function(opt) {
                html += '<div class="radio-option">';
                html += '<input type="radio" name="' + inp.id + '" id="' + inp.id + '_' + opt.value + '" value="' + opt.value + '">';
                html += '<label for="' + inp.id + '_' + opt.value + '">' + opt.value + '. ' + opt.text + '</label>';
                html += '</div>';
            });
            html += '</div>';
        } else if (inp.type === 'text') {
            html += '<div class="input-group">';
            if (inp.label) html += '<label for="' + inp.id + '">' + inp.label + '</label>';
            var txtWidth = inp.normalize === 'poly' ? '260px' : '320px';
            var defaultPh = inp.normalize === 'poly' ? 'e.g. 4x^2 + 2x - 3' : inp.normalize === 'none' ? 'e.g. quotient + R/(divisor)' : 'Enter your answer';
            var txtPlaceholder = ' placeholder="' + (inp.placeholder || defaultPh) + '"';
            html += '<input type="text" id="' + inp.id + '" aria-describedby="feedback-' + (q ? q.id : inp.id) + '" style="width:' + txtWidth + ';" autocomplete="off"' + txtPlaceholder + '>';
            html += '</div>';
        }
        return html;
    }

    /* --- Box Method Renderer --- */
    function renderBoxGrid(q) {
        var b = q.box;
        var cols = b.cols, rows = b.rows;
        var cellMap = {};
        (b.cells || []).forEach(function(c) { cellMap[c.row + ',' + c.col] = c.input_id; });

        var html = '<div class="box-grid-wrap">';
        html += '<table class="box-grid" role="presentation">';

        // Header row: empty corner + one editable input per col
        html += '<tr><th class="box-corner"></th>';
        cols.forEach(function(c, ci) {
            var hId = q.id + '_col' + ci;
            html += '<th class="box-header box-header-input"><input type="text" id="' + hId + '" class="box-input" autocomplete="off" placeholder="?" aria-label="Column ' + (ci + 1) + ' header"></th>';
        });
        html += '</tr>';

        // Data rows: editable row header + editable interior cells
        rows.forEach(function(r, ri) {
            html += '<tr>';
            var rId = q.id + '_row' + ri;
            html += '<th class="box-header box-header-input"><input type="text" id="' + rId + '" class="box-input" autocomplete="off" placeholder="?" aria-label="Row ' + (ri + 1) + ' header"></th>';
            cols.forEach(function(c, ci) {
                var inputId = cellMap[ri + ',' + ci];
                var inp = (q.inputs || []).find(function(i) { return i.id === inputId; });
                html += '<td class="box-cell">';
                if (inp) {
                    html += '<input type="text" id="' + inp.id + '" class="box-input" autocomplete="off" placeholder="?"' +
                        ' aria-label="Row ' + (ri+1) + ' Col ' + (ci+1) + '">';
                }
                html += '</td>';
            });
            html += '</tr>';
        });

        html += '</table></div>';
        return html;
    }

    function renderBoxReverse(q) {
        var b = q.box;
        var knownFactor = b.known_factor || [];
        var degree = b.missing_factor_degree || 1;
        var numCols = degree + 1;
        var partialTop = b.partial_top || [];

        var html = '<div class="box-grid-wrap">';
        html += '<table class="box-grid" role="presentation">';

        // Header row: empty corner + top header cells
        // partial_top[i] = pre-filled static label; null = editable input
        html += '<tr><th class="box-corner"></th>';
        for (var ci = 0; ci < numCols; ci++) {
            if (partialTop[ci]) {
                html += '<th class="box-header">\\(' + partialTop[ci] + '\\)</th>';
            } else {
                var hId = q.id + '_top' + ci;
                html += '<th class="box-header box-header-input"><input type="text" id="' + hId + '" class="box-input" autocomplete="off" placeholder="?" aria-label="Top header ' + (ci + 1) + '"></th>';
            }
        }
        html += '</tr>';

        // Known factor rows: pre-filled left headers + editable interior cells
        knownFactor.forEach(function(term, ri) {
            html += '<tr>';
            html += '<th class="box-header">\\(' + term + '\\)</th>';
            for (var ci2 = 0; ci2 < numCols; ci2++) {
                var cellId = q.id + '_r' + ri + 'c' + ci2;
                html += '<td class="box-cell"><input type="text" id="' + cellId + '" class="box-input" autocomplete="off" placeholder="?" aria-label="Row ' + term + ' col ' + (ci2 + 1) + '"></td>';
            }
            html += '</tr>';
        });

        html += '</table></div>';
        return html;
    }

    function renderGraph(q) {
        var g = q.graph;
        var readOnly = !!g.read_only;
        var html = '<div class="graph-container">';
        html += '<canvas id="' + g.canvas_id + '" width="500" height="500" role="application" tabindex="0" aria-label="' + (readOnly ? 'Graph of polynomial function. Read the graph to answer the questions below.' : 'Interactive graph for ' + (g.function_display || g.canvas_id) + '. Arrow keys move cursor. Enter to place point. Delete to remove.') + '"></canvas>';
        html += '<div class="graph-tooltip" id="tooltip-' + g.canvas_id + '"></div>';
        html += '</div>';
        if (!readOnly) {
            html += '<div class="graph-counter" id="counter-' + g.canvas_id + '">Click to plot points on the graph</div>';
            html += '<div class="graph-controls">';
            if (g.asymptotes) {
                html += '<button class="graph-btn" id="vaBtn-' + g.canvas_id + '" aria-label="Add vertical asymptote: click then click on graph" onclick="setAsymptoteMode(\'' + g.canvas_id + '\',\'vertical\')">ADD VERTICAL ASYMPTOTE</button>';
                html += '<button class="graph-btn" id="haBtn-' + g.canvas_id + '" aria-label="Add horizontal asymptote: click then click on graph" onclick="setAsymptoteMode(\'' + g.canvas_id + '\',\'horizontal\')">ADD HORIZONTAL ASYMPTOTE</button>';
            }
            html += '<button class="graph-btn check-graph" id="checkBtn-' + g.canvas_id + '" disabled aria-label="Check graph answer" onclick="checkGraphAnswer(\'' + g.canvas_id + '\')">CHECK GRAPH</button>';
            html += '<button class="graph-btn" aria-label="Clear all points and asymptotes" onclick="clearGraph(\'' + g.canvas_id + '\')">CLEAR</button>';
            html += '</div>';
        }
        html += '<div class="graph-result" id="result-' + g.canvas_id + '"></div>';
        return html;
    }

    /* --- Graph Engine --- */
    /**
     * Initializes a canvas graph for a question.
     * @param {string} canvasId - The canvas element ID
     * @param {Object} graphConfig - Graph configuration (xRange, yRange, fn, expectedPoints, asymptotes)
     */
    function initGraph(canvasId, graphConfig) {
        var canvas = document.getElementById(canvasId);
        if (!canvas) return;
        var ctx = canvas.getContext('2d');
        var w = canvas.width, h = canvas.height;
        var ml = 40, mr = 20, mt = 20, mb = 35;
        var pw = w - ml - mr, ph = h - mt - mb;

        graphData[canvasId] = {
            canvas: canvas, ctx: ctx, config: graphConfig,
            points: [], asymptotes: { vertical: [], horizontal: [] },
            asymptoteMode: null, answerOverlay: false,
            w: w, h: h, ml: ml, mr: mr, mt: mt, mb: mb, pw: pw, ph: ph,
            kbCursor: { x: 0, y: 0 }, kbFocused: false
        };

        // Keyboard accessibility (WCAG 2.1.1)
        canvas.addEventListener('focus', function() {
            var d = graphData[canvasId];
            d.kbFocused = true;
            redrawGraph(canvasId);
            updateGraphCounter(canvasId);
            announceGraph(canvasId, 'Graph focused. Cursor at (' + d.kbCursor.x + ', ' + d.kbCursor.y + '). Arrow keys to move, Enter to place point.');
        });
        canvas.addEventListener('blur', function() {
            graphData[canvasId].kbFocused = false;
            redrawGraph(canvasId);
        });
        canvas.addEventListener('keydown', function(e) {
            var d = graphData[canvasId];
            var step = e.shiftKey ? 0.25 : 1;
            var moved = false;
            if (e.key === 'ArrowRight') { d.kbCursor.x = Math.min(d.kbCursor.x + step, 15); moved = true; }
            if (e.key === 'ArrowLeft')  { d.kbCursor.x = Math.max(d.kbCursor.x - step, -15); moved = true; }
            if (e.key === 'ArrowUp')    { d.kbCursor.y = Math.min(d.kbCursor.y + step, 15); moved = true; }
            if (e.key === 'ArrowDown')  { d.kbCursor.y = Math.max(d.kbCursor.y - step, -15); moved = true; }
            if (moved) { e.preventDefault(); redrawGraph(canvasId); updateGraphCounter(canvasId); return; }
            if (e.key === 'Enter' || e.key === ' ') {
                e.preventDefault();
                var sx = d.kbCursor.x, sy = d.kbCursor.y;
                if (d.asymptoteMode === 'vertical') {
                    d.asymptotes.vertical = [sx]; d.asymptoteMode = null;
                    var vb = document.getElementById('vaBtn-' + canvasId);
                    if (vb) vb.classList.remove('active');
                    updateGraphCounter(canvasId); redrawGraph(canvasId); return;
                }
                if (d.asymptoteMode === 'horizontal') {
                    d.asymptotes.horizontal = [sy]; d.asymptoteMode = null;
                    var hb2 = document.getElementById('haBtn-' + canvasId);
                    if (hb2) hb2.classList.remove('active');
                    updateGraphCounter(canvasId); redrawGraph(canvasId); return;
                }
                for (var ri = d.points.length - 1; ri >= 0; ri--) {
                    if (Math.abs(d.points[ri].gx - sx) < 0.5 && Math.abs(d.points[ri].gy - sy) < 0.5) {
                        d.points.splice(ri, 1);
                        updateGraphCounter(canvasId); redrawGraph(canvasId);
                        announceGraph(canvasId, 'Point removed. ' + d.points.length + ' points total.'); return;
                    }
                }
                var screenX2 = d.ml + ((sx + 16) / 32) * d.pw;
                var screenY2 = d.mt + ((-sy + 16) / 32) * d.ph;
                d.points.push({ x: screenX2, y: screenY2, gx: sx, gy: sy, status: null });
                updateGraphCounter(canvasId); redrawGraph(canvasId);
                announceGraph(canvasId, 'Point placed at (' + sx + ', ' + sy + '). ' + d.points.length + ' points total.');
            }
            if (e.key === 'Delete' || e.key === 'Backspace') {
                e.preventDefault();
                var d2 = graphData[canvasId];
                if (d2.points.length > 0) {
                    d2.points.pop(); updateGraphCounter(canvasId); redrawGraph(canvasId);
                    announceGraph(canvasId, 'Last point removed. ' + d2.points.length + ' points total.');
                }
            }
        });

        canvas.addEventListener('mousemove', function(e) {
            var rect = canvas.getBoundingClientRect();
            var sx = Math.round((((e.clientX - rect.left) * (w / rect.width) - ml) / pw * 32 - 16) * 4) / 4;
            var sy = Math.round((-((e.clientY - rect.top) * (h / rect.height) - mt) / ph * 32 + 16) * 4) / 4;
            var tip = document.getElementById('tooltip-' + canvasId);
            if (tip) {
                tip.style.display = 'block';
                tip.textContent = '(' + sx + ', ' + sy + ')';
                tip.style.left = (e.clientX + 12) + 'px';
                tip.style.top = (e.clientY - 28) + 'px';
            }
        });

        canvas.addEventListener('mouseleave', function() {
            var tip = document.getElementById('tooltip-' + canvasId);
            if (tip) tip.style.display = 'none';
        });

        canvas.addEventListener('click', function(e) {
            var d = graphData[canvasId];
            var rect = canvas.getBoundingClientRect();
            var cx = (e.clientX - rect.left) * (w / rect.width);
            var cy = (e.clientY - rect.top) * (h / rect.height);
            var sx = Math.round(((cx - ml) / pw * 32 - 16) * 4) / 4;
            var sy = Math.round((-((cy - mt) / ph * 32 - 16)) * 4) / 4;

            if (d.asymptoteMode === 'vertical') {
                d.asymptotes.vertical = [sx];
                d.asymptoteMode = null;
                var vb = document.getElementById('vaBtn-' + canvasId);
                if (vb) vb.classList.remove('active');
                updateGraphCounter(canvasId);
                redrawGraph(canvasId);
                return;
            }
            if (d.asymptoteMode === 'horizontal') {
                d.asymptotes.horizontal = [sy];
                d.asymptoteMode = null;
                var hb = document.getElementById('haBtn-' + canvasId);
                if (hb) hb.classList.remove('active');
                updateGraphCounter(canvasId);
                redrawGraph(canvasId);
                return;
            }

            // Remove if near existing point
            for (var i = d.points.length - 1; i >= 0; i--) {
                if (Math.abs(d.points[i].gx - sx) < 0.5 && Math.abs(d.points[i].gy - sy) < 0.5) {
                    d.points.splice(i, 1);
                    updateGraphCounter(canvasId);
                    redrawGraph(canvasId);
                    return;
                }
            }
            var screenX = ml + ((sx + 16) / 32) * pw;
            var screenY = mt + ((-sy + 16) / 32) * ph;
            d.points.push({ x: screenX, y: screenY, gx: sx, gy: sy, status: null });
            updateGraphCounter(canvasId);
            redrawGraph(canvasId);
        });

        // pre_draw: show function curve immediately (read-graph questions where Kai reads, not plots)
        if (graphConfig.pre_draw) {
            graphData[canvasId].answerOverlay = true;
            redrawGraph(canvasId);
        } else {
            drawGrid(canvasId);
        }
    }

    function drawGrid(canvasId) {
        var d = graphData[canvasId];
        var ctx = d.ctx;
        ctx.clearRect(0, 0, d.w, d.h);
        ctx.fillStyle = CANVAS.bg;
        ctx.fillRect(0, 0, d.w, d.h);
        var step = d.pw / 32;

        ctx.strokeStyle = CANVAS.gridMinor; ctx.lineWidth = 1;
        for (var i = 0; i <= 32; i++) {
            var x = d.ml + i * step;
            ctx.beginPath(); ctx.moveTo(x, d.mt); ctx.lineTo(x, d.mt + d.ph); ctx.stroke();
            var y = d.mt + i * step;
            ctx.beginPath(); ctx.moveTo(d.ml, y); ctx.lineTo(d.ml + d.pw, y); ctx.stroke();
        }
        ctx.strokeStyle = CANVAS.gridMajor; ctx.lineWidth = 1.5;
        for (var i2 = -15; i2 <= 15; i2 += 5) {
            if (i2 === 0) continue;
            var mx = d.ml + (i2 + 16) * step;
            ctx.beginPath(); ctx.moveTo(mx, d.mt); ctx.lineTo(mx, d.mt + d.ph); ctx.stroke();
            var my = d.mt + (16 - i2) * step;
            ctx.beginPath(); ctx.moveTo(d.ml, my); ctx.lineTo(d.ml + d.pw, my); ctx.stroke();
        }
        ctx.strokeStyle = CANVAS.axis; ctx.lineWidth = 2;
        var xAxisY = d.mt + d.ph / 2, yAxisX = d.ml + d.pw / 2;
        ctx.beginPath(); ctx.moveTo(d.ml, xAxisY); ctx.lineTo(d.ml + d.pw, xAxisY); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(yAxisX, d.mt); ctx.lineTo(yAxisX, d.mt + d.ph); ctx.stroke();

        ctx.fillStyle = CANVAS.label; ctx.font = 'bold 14px Arial'; ctx.textAlign = 'center';
        for (var n = -15; n <= 15; n += 5) {
            if (n === 0) continue;
            ctx.fillText(n, d.ml + d.pw / 2 + n * step, xAxisY + 20);
        }
        ctx.textAlign = 'right';
        for (var m = -15; m <= 15; m += 5) {
            if (m === 0) continue;
            ctx.fillText(m, yAxisX - 8, d.mt + d.ph / 2 - m * step + 5);
        }
        ctx.textAlign = 'left';
        ctx.fillText('0', yAxisX + 6, xAxisY + 18);
    }

    function redrawGraph(canvasId) {
        var d = graphData[canvasId];
        if (!d) return;
        drawGrid(canvasId);
        var ctx = d.ctx;

        // Asymptotes (dashed red)
        ctx.save();
        ctx.setLineDash([8, 6]);
        ctx.strokeStyle = CANVAS.incorrect; ctx.lineWidth = 2.5;
        d.asymptotes.vertical.forEach(function(gx) {
            var sx = d.ml + ((gx + 16) / 32) * d.pw;
            ctx.beginPath(); ctx.moveTo(sx, d.mt); ctx.lineTo(sx, d.mt + d.ph); ctx.stroke();
        });
        d.asymptotes.horizontal.forEach(function(gy) {
            var sy = d.mt + ((-gy + 16) / 32) * d.ph;
            ctx.beginPath(); ctx.moveTo(d.ml, sy); ctx.lineTo(d.ml + d.pw, sy); ctx.stroke();
        });
        ctx.restore();

        // Answer overlay curve
        if (d.answerOverlay && d.config && d.config.function) {
            try {
                var func = new Function('x', 'return ' + d.config.function);
                ctx.save();
                ctx.strokeStyle = CANVAS.blue; ctx.lineWidth = 3;
                ctx.beginPath();
                var started = false;
                for (var gx = -16; gx <= 16; gx += 0.05) {
                    var fy = func(gx);
                    if (fy === null || fy === undefined || !isFinite(fy) || fy < -16 || fy > 16) { started = false; continue; }
                    var px = d.ml + ((gx + 16) / 32) * d.pw;
                    var py = d.mt + ((-fy + 16) / 32) * d.ph;
                    if (!started) { ctx.moveTo(px, py); started = true; }
                    else ctx.lineTo(px, py);
                }
                ctx.stroke();
                ctx.restore();
            } catch(e) {}
        }

        // Points
        d.points.forEach(function(p) {
            ctx.beginPath();
            ctx.arc(p.x, p.y, 6, 0, 2 * Math.PI);
            if (p.status === 'correct') ctx.fillStyle = CANVAS.correct;
            else if (p.status === 'incorrect') ctx.fillStyle = CANVAS.incorrect;
            else ctx.fillStyle = CANVAS.blue;
            ctx.fill();
            ctx.strokeStyle = CANVAS.pointStroke; ctx.lineWidth = 1.5;
            ctx.stroke();
        });

        // Keyboard cursor ring (shown when canvas is keyboard-focused)
        if (d.kbFocused) {
            var ksx = d.ml + ((d.kbCursor.x + 16) / 32) * d.pw;
            var ksy = d.mt + ((-d.kbCursor.y + 16) / 32) * d.ph;
            ctx.save();
            ctx.beginPath();
            ctx.arc(ksx, ksy, 9, 0, 2 * Math.PI);
            ctx.strokeStyle = '#4A90D9';
            ctx.lineWidth = 2;
            ctx.setLineDash([4, 2]);
            ctx.stroke();
            ctx.setLineDash([]);
            ctx.restore();
        }
    }

    /**
     * Announces a message to screen readers via a polite aria-live region for the graph canvas.
     * @param {string} canvasId - Canvas ID (for disambiguation)
     * @param {string} msg - Text to announce

    function announceGraph(canvasId, msg) {

        if (!lr) {
            lr = document.createElement('div');

            lr.setAttribute('aria-live', 'polite');
            lr.setAttribute('aria-atomic', 'true');

        }
        lr.textContent = msg;
    }

    function updateGraphCounter(canvasId) {
        var d = graphData[canvasId];
        var cfg = d.config;
        var n = d.points.length;
        var minPts = cfg.min_points || 5;
        var counter = document.getElementById('counter-' + canvasId);
        var checkBtn = document.getElementById('checkBtn-' + canvasId);

        var kbInfo = d.kbFocused ? ' | cursor: (' + d.kbCursor.x + ', ' + d.kbCursor.y + ')' : '';
        var ready = n >= minPts;
        if (cfg.asymptotes) {
            var va = d.asymptotes.vertical.length;
            var ha = d.asymptotes.horizontal.length;
            var needVA = cfg.asymptotes.vertical ? cfg.asymptotes.vertical.length : 0;
            var needHA = cfg.asymptotes.horizontal ? cfg.asymptotes.horizontal.length : 0;
            counter.textContent = n + ' of ' + minPts + ' points · Asymptotes: ' + (va + ha) + '/' + (needVA + needHA) + kbInfo;
            ready = ready && va >= needVA && ha >= needHA;
        } else {
            counter.textContent = (n > 0 ? n + ' of ' + minPts + ' points' : 'Click or use arrow keys to plot at least ' + minPts + ' points') + kbInfo;
        }
        checkBtn.disabled = !ready;
    }

    function clearGraph(canvasId) {
        var d = graphData[canvasId];
        d.points = [];
        d.asymptotes = { vertical: [], horizontal: [] };
        d.asymptoteMode = null;
        d.answerOverlay = false;
        var r = document.getElementById('result-' + canvasId);

    /**
     * Checks plotted graph points and asymptotes against the expected function.
     * @param {string} canvasId - The canvas element ID to evaluate
     * @returns {Object} { correct: number, total: number, asymptoteCorrect: boolean }
     */
    function checkGraphAnswer(canvasId) {
        var d = graphData[canvasId];
        var cfg = d.config;
        var tolerance = cfg.tolerance || 0.25;
        var func;
        try { func = new Function('x', 'return ' + cfg.function); } catch(e) { return; }

        var correct = 0;
        d.points.forEach(function(p) {
            var expected = func(p.gx);
            if (expected !== null && isFinite(expected) && Math.abs(p.gy - expected) <= tolerance) {
                p.status = 'correct'; correct++;
            } else {
                p.status = 'incorrect';
            }
        });

        // Check asymptotes
        var asymOk = true;
        if (cfg.asymptotes) {
            if (cfg.asymptotes.vertical) {
                cfg.asymptotes.vertical.forEach(function(expected) {
                    if (d.asymptotes.vertical.length === 0 || Math.abs(d.asymptotes.vertical[0] - expected) > tolerance) asymOk = false;
                });
            }
            if (cfg.asymptotes.horizontal) {
                cfg.asymptotes.horizontal.forEach(function(expected) {
                    if (d.asymptotes.horizontal.length === 0 || Math.abs(d.asymptotes.horizontal[0] - expected) > tolerance) asymOk = false;
                });
            }
        }

        var allCorrect = correct === d.points.length && asymOk;
        var r = document.getElementById('result-' + canvasId);
        if (allCorrect) {
            r.className = 'graph-result show correct';
            r.textContent = '🔥 ' + correct + '/' + d.points.length + ' points correct.' + (cfg.asymptotes ? ' Asymptotes correct.' : '');
        } else {
            r.className = 'graph-result show incorrect';
            r.textContent = correct + '/' + d.points.length + ' points.' + (cfg.asymptotes ? ' Asymptotes: ' + (asymOk ? '✓' : '✗') + '.' : '') + ' Red = off.';
            d.answerOverlay = true;
        }
        redrawGraph(canvasId);

        // Store graph result on the graphData for grading
        d.gradeResult = allCorrect;
    }

    /**
     * Show a hint layer for a question. Layers: 1=nudge, 2=answer key, 3=solution steps.
     * @param {string} qId - Question ID
     * @param {number} layer - Hint layer (1|2|3)
     */
    function showHint(qId, layer) {
        var q = examData.questions.find(function(q) { return q.id === qId; });
        if (!q) return;

        var el = document.getElementById('hint-' + qId + '-' + layer);
        if (!el) return;

        if (layer === 1) {
            el.classList.add('show');
            document.getElementById('hintBtn-' + qId + '-2').style.display = 'inline-block';
            var btn1 = document.getElementById('hintBtn-' + qId + '-1');
            if (btn1) btn1.setAttribute('aria-expanded', 'true');
        } else if (layer === 2) {
            // Show answer
            var answerText = '';
            q.inputs.forEach(function(inp) {
                if (inp.type === 'radio') {
                    var opt = inp.options.find(function(o) { return o.value === inp.answer; });
                    answerText += inp.answer + (opt ? ': ' + opt.text : '') + '<br>';
                } else {
                    answerText += (inp.label || inp.id) + ' ' + inp.answer + '<br>';
                }
            });
            el.innerHTML = answerText;
            el.classList.add('show');
            document.getElementById('hintBtn-' + qId + '-3').style.display = 'inline-block';
        } else if (layer === 3) {
            // Solution steps
            if (q.solution_steps) {
                el.innerHTML = q.solution_steps.map(function(s) { return '<p>' + s + '</p>'; }).join('');
            }
            el.classList.add('show');
        }

        // Re-render KaTeX in hint layers
        if (typeof renderMathInElement === 'function') {
            renderMathInElement(el, {
                delimiters: [{left: '\\(', right: '\\)', display: false}, {left: '\\[', right: '\\]', display: true}]
            });
        }
    }

    function updateProgress(total) {
        var answered = 0;
        var cards = document.querySelectorAll('.question-card');
        cards.forEach(function(card) {
            var inputs = card.querySelectorAll('input, select, textarea');
            var hasValue = false;
            inputs.forEach(function(inp) {
                if (inp.type === 'radio') {
                    if (inp.checked) hasValue = true;
                } else if (inp.value && inp.value.trim() !== '') {
                    hasValue = true;
                }
            });
            if (hasValue) {
                answered++;
                card.classList.add('answered');
            } else {
                card.classList.remove('answered');
            }
        });

        var pct = total > 0 ? Math.round((answered / total) * 100) : 0;
        var fill = document.getElementById('progressFill');
        var text = document.getElementById('progressText');
        if (fill) fill.style.width = pct + '%';
        if (fill) fill.parentElement && fill.parentElement.setAttribute('aria-valuenow', pct);
        if (text) text.textContent = answered + ' / ' + total;

        // Color shift at milestones
        if (fill) {
            if (pct >= 100) fill.style.background = 'var(--color-correct)';
            else if (pct >= 50) fill.style.background = 'var(--accent-blue)';
            else fill.style.background = 'var(--accent-blue)';
        }
    }

    function triggerRescue(qId, fbEl) {
        var hints = document.getElementById('hints-' + qId);
        if (!hints) return;
        hints.style.display = '';
        var hint1 = document.getElementById('hint-' + qId + '-1');
        if (hint1) hint1.style.display = '';
        var hintBtn2 = document.getElementById('hintBtn-' + qId + '-2');
        if (hintBtn2) hintBtn2.style.display = '';
        var hintBtn3 = document.getElementById('hintBtn-' + qId + '-3');
        if (hintBtn3) hintBtn3.style.display = '';
        // Announce auto-rescue to screen readers (GD spec: aria-live polite on rescue)
        var liveEl = document.createElement('div');
        liveEl.setAttribute('aria-live', 'polite');
        liveEl.setAttribute('class', 'sr-only');
        liveEl.textContent = 'Hint revealed. Check below.';
        document.body.appendChild(liveEl);
        setTimeout(function() { if (liveEl.parentNode) liveEl.parentNode.removeChild(liveEl); }, 3000);
        var prefersReduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        hints.scrollIntoView({ behavior: prefersReduced ? 'instant' : 'smooth', block: 'nearest' });
    }

    // sw-16: auto-rescue with delay. Inserts transitional message at t=800ms, reveals hint at t=1200ms.
    // Manual hint clicks bypass this delay entirely.
    function scheduleRescue(qId, fbEl) {
        var prefersReduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        var delay1 = prefersReduced ? 0 : 800;
        var delay2 = prefersReduced ? 0 : 1200;
        var hints = document.getElementById('hints-' + qId);
        if (!hints) return;
        var msgEl = document.createElement('p');
        msgEl.id = 'rescue-msg-' + qId;
        msgEl.setAttribute('aria-live', 'polite');
        msgEl.style.cssText = 'font-size:var(--text-sm,0.813rem);color:var(--text-secondary,#6E7681);margin:0 0 4px;opacity:0;transition:opacity 200ms';
        msgEl.textContent = 'Here is a direction to try --';
        setTimeout(function() {
            if (document.getElementById('rescue-msg-' + qId)) return; // already added
            hints.parentNode.insertBefore(msgEl, hints);
            // Trigger fade-in
            requestAnimationFrame(function() { requestAnimationFrame(function() { msgEl.style.opacity = '1'; }); });
        }, delay1);
        setTimeout(function() { triggerRescue(qId, fbEl); }, delay2);
    }
