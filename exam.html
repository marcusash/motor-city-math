    /**
     * Pure helper: check whether a set of parsed number inputs is correct.
     * Supports both ordered and plus-minus (either-order) grading.
     * @param {Array} numberInputs - [{val, answer, tolerance}]
     * @param {boolean} plusMinus - accept either ordering of two inputs
     * @returns {boolean} true if all inputs are within tolerance
     */
    function evaluateNumberInputs(numberInputs, plusMinus) {
        if (plusMinus && numberInputs.length === 2) {
            var a = numberInputs[0], b = numberInputs[1];
            var order1 = Math.abs(a.val - a.answer) <= a.tolerance && Math.abs(b.val - b.answer) <= b.tolerance;
            var order2 = Math.abs(a.val - b.answer) <= a.tolerance && Math.abs(b.val - a.answer) <= b.tolerance;
            return order1 || order2;
        }
        return numberInputs.every(function(n) {
            return !isNaN(n.val) && Math.abs(n.val - n.answer) <= n.tolerance;
        });
    }

    /**
     * Returns an array of human-readable labels for blank required inputs.
     * Checks dropdown (no value), number (empty string), radio (no selection).
     * Text inputs are self-graded — not validated here.
     * @param {Array} questions - exam question objects with inputs[]
     * @returns {string[]} missing labels, e.g. ['Q1 — Parent function', 'Q3 — answer choice']
     */
    function findMissingInputLabels(questions) {
        var missing = [];
        (questions || []).forEach(function(q, qi) {
            var qLabel = 'Q' + (qi + 1);
            (q.inputs || []).forEach(function(inp) {
                if (inp.type === 'dropdown') {
                    var el = document.getElementById(inp.id);
                    if (!el || !el.value) missing.push(qLabel + ' \u2014 ' + (inp.label || 'Parent function'));
                } else if (inp.type === 'number') {
                    var el2 = document.getElementById(inp.id);
                    if (!el2 || el2.value.trim() === '') missing.push(qLabel + ' \u2014 ' + (inp.label || inp.id));
                } else if (inp.type === 'radio') {
                    var sel = document.querySelector('input[name="' + inp.id + '"]:checked');
                    if (!sel) missing.push(qLabel + ' \u2014 answer choice');
                }
            });
        });
        return missing;
    }

    /**
     * Grade all auto-gradable inputs, compute score, show scorecard, save results.
     * Idempotent: no-op if already graded (examGraded flag).
     *
     * Concerns (in order):
     *   1. Guard       — skip if already graded, hide tracker UI
     *   2. Validation  — block if any required field is blank
     *   3. Grading     — evaluate each question's inputs, compute scores
     *   4. Feedback    — display per-question correct/wrong feedback and hints
     *   5. Scorecard   — render final scorecard, persist score to mcm_scores
     */
    /* Normalize a polynomial string for comparison.
       Strips spaces, lowercases, converts unicode minus to ASCII,
       so "4x^2 + 2x + 5" == "4x^2+2x+5" == "4x^2  +  2x + 5". */
    function normalizePoly(s) {
        if (!s) return '';
        return s.toString()
            .toLowerCase()
            .replace(/\u2212/g, '-')   // unicode minus
            .replace(/\s+/g, '')       // all whitespace
            .replace(/\*\*/g, '^');    // ** -> ^
    }

    function gradeExam() {
        if (examGraded) return;

        // == SECTION 1: Guard ==
        // Hide position tracker during graded state
        var tracker = document.getElementById('questionTracker');
        if (tracker) tracker.style.display = 'none';

        // == SECTION 2: Validation ==
        // Block grading if any required field is blank
        var missing = findMissingInputLabels(examData.questions);
        if (missing.length > 0) {
            var warnEl = document.getElementById('submitWarning');
            if (!warnEl) {
                warnEl = document.createElement('div');
                warnEl.id = 'submitWarning';
                warnEl.className = 'submit-warning';
                document.getElementById('submitArea').insertBefore(warnEl, document.getElementById('submitArea').firstChild);
            }
            warnEl.innerHTML = '<strong>Fill in everything before grading.</strong> Missing: ' +
                missing.join(', ') + '.';
            warnEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
            return;
        }

        examGraded = true;
        sessionStorage.removeItem('exam-autosave-' + examId);

        // Hide progress bar after grading
        var strip = document.getElementById('progressStrip');
        if (strip) strip.classList.remove('active');

        // == SECTION 3: Grading ==
        var questions = examData.questions;
        var score = 0, total = questions.length;
        var results = [];
        var stdScores = {};

        questions.forEach(function(q) {
            var qCorrect = true;
            var std = q.standard;
            if (!stdScores[std]) stdScores[std] = { correct: 0, total: 0 };
            stdScores[std].total++;

            // Check graph questions (skip point validation for read_only graphs -- Kai reads, not plots)
            if (q.graph && !q.graph.read_only) {
                var gd = graphData[q.graph.canvas_id];
                if (!gd || !gd.gradeResult) {
                    // Auto-check graph if not checked yet
                    if (gd && gd.points.length >= (q.graph.min_points || 5)) {
                        checkGraphAnswer(q.graph.canvas_id);
                        gd = graphData[q.graph.canvas_id];
                    }
                    if (!gd || !gd.gradeResult) qCorrect = false;
                }
            }

            // Check all inputs
            var numberInputs = [];
            (q.inputs || []).forEach(function(inp) {
                if (inp.type === 'dropdown') {
                    var el = document.getElementById(inp.id);
                    if (!el || el.value !== inp.answer) qCorrect = false;
                } else if (inp.type === 'number') {
                    var el2 = document.getElementById(inp.id);
                    var val = el2 ? parseStudentAnswer(el2.value) : NaN;
                    numberInputs.push({ el: el2, val: val, answer: inp.answer, tolerance: inp.tolerance || 0.01 });
                } else if (inp.type === 'radio') {
                    var selected = document.querySelector('input[name="' + inp.id + '"]:checked');
                    if (!selected || selected.value !== inp.answer) qCorrect = false;
                } else if (inp.type === 'text') {
                    if (inp.normalize === 'poly' && inp.answer) {
                        var elT = document.getElementById(inp.id);
                        if (elT) {
                            var userPoly = normalizePoly(elT.value);
                            var ansPoly = normalizePoly(inp.answer);
                            if (userPoly !== ansPoly) {
                                qCorrect = false;
                                elT.style.borderColor = 'var(--color-incorrect, #F85149)';
                                elT.style.borderWidth = '2px';
                                elT.style.borderStyle = 'solid';
                            } else {
                                elT.style.borderColor = 'var(--color-correct, #3FB950)';
                                elT.style.borderWidth = '2px';
                                elT.style.borderStyle = 'solid';
                            }
                        }
                    } else if (inp.normalize === 'none' && inp.answer) {
                        var elN = document.getElementById(inp.id);
                        if (elN) {
                            var okN = normalizePoly(elN.value) === normalizePoly(inp.answer);
                            if (!okN) {
                                qCorrect = false;
                                elN.style.borderColor = 'var(--color-incorrect, #F85149)';
                                elN.style.borderWidth = '2px';
                                elN.style.borderStyle = 'solid';
                            } else {
                                elN.style.borderColor = 'var(--color-correct, #3FB950)';
                                elN.style.borderWidth = '2px';
                                elN.style.borderStyle = 'solid';
                            }
                        }
                    }
                    // normalize:none without answer: true self-graded, skip auto-grade
                }
            });

            // Grade box col/row headers
            if (q.type === 'box' && q.box) {
                (q.box.cols || []).forEach(function(ans, ci) {
                    var el = document.getElementById(q.id + '_col' + ci);
                    if (el) {
                        var ok = normalizePoly(el.value) === normalizePoly(ans);
                        if (!ok) qCorrect = false;
                        el.style.borderColor = ok ? 'var(--color-correct, #3FB950)' : 'var(--color-incorrect, #F85149)';
                        el.style.borderWidth = '2px';
                        el.style.borderStyle = 'solid';
                    }
                });
                (q.box.rows || []).forEach(function(ans, ri) {
                    var el = document.getElementById(q.id + '_row' + ri);
                    if (el) {
                        var ok = normalizePoly(el.value) === normalizePoly(ans);
                        if (!ok) qCorrect = false;
                        el.style.borderColor = ok ? 'var(--color-correct, #3FB950)' : 'var(--color-incorrect, #F85149)';
                        el.style.borderWidth = '2px';
                        el.style.borderStyle = 'solid';
                    }
                });
            }

            // Handle plus_minus: accept either ordering of number inputs
            var numberInputsCorrect = evaluateNumberInputs(numberInputs, q.plus_minus);
            if (!numberInputsCorrect) qCorrect = false;

            // Color number input borders based on individual correctness
            if (!q.plus_minus) {
                numberInputs.forEach(function(n) {
                    var ok = !isNaN(n.val) && Math.abs(n.val - n.answer) <= n.tolerance;
                    if (n.el) {
                        n.el.style.borderColor = ok ? 'var(--color-correct, #3FB950)' : 'var(--color-incorrect, #F85149)';
                        n.el.style.borderWidth = '2px';
                        n.el.style.borderStyle = 'solid';
                    }
                });
            }

            if (qCorrect) {
                score++;
                stdScores[std].correct++;
                // Update answered count for position tracker (GD spec: show answered count)
                if (!window.answeredQuestions) window.answeredQuestions = {};
                if (!window.answeredQuestions[q.id]) {
                    window.answeredQuestions[q.id] = true;
                    window.mcmAnsweredCount = Object.keys(window.answeredQuestions).length;
                    if (typeof window.mcmUpdateTrackerDisplay === 'function') {
                        window.mcmUpdateTrackerDisplay(window.mcmTrackerCurrentQ || 1);
                        // All-done flash (Enhancement 2: reduced-motion guard is in CSS)
                        if (examData && window.mcmAnsweredCount >= examData.questions.length) {
                            var tr = document.getElementById('questionTracker');
                            if (tr) { tr.classList.add('tracker-all-done'); setTimeout(function() { tr.classList.remove('tracker-all-done'); }, 300); }
                        }
                    }
                }
            }
            results.push(qCorrect);

            // == SECTION 4: Feedback (per-question) ==
            // Show feedback
            var fb = document.getElementById('feedback-' + q.id);
            if (fb) {
                var msg = qCorrect ? (q.feedback_correct || '🔥 Correct!') : (q.feedback_wrong || "Check the hint -- it's there for a reason.");
                // Graph+vertex split: if graph failed but all number inputs were correct, say so
                if (!qCorrect && q.graph && numberInputs.length > 0) {
                    var allInputsCorrect = numberInputs.every(function(n) {
                        return !isNaN(n.val) && Math.abs(n.val - n.answer) <= n.tolerance;
                    });
                    if (allInputsCorrect) {
                        msg = 'Graph points need work — but your vertex is correct. Check the plotted points.';
                    }
                }
                // Check for specific wrong feedback variants
                if (!qCorrect) {
                    if (q.feedback_wrong_parent || q.feedback_wrong_intercepts) {
                        var parentInp = (q.inputs || []).find(function(i) { return i.id.indexOf('_parent') !== -1; });
                        var parentEl = parentInp ? document.getElementById(parentInp.id) : null;
                        if (parentEl && parentInp) {
                            if (parentEl.value === parentInp.answer && q.feedback_wrong_intercepts) {
                                msg = q.feedback_wrong_intercepts;
                            } else if (q.feedback_wrong_parent) {
                                msg = q.feedback_wrong_parent;
                            }
                        }
                    }
                }
                fb.className = 'answer-feedback show ' + (qCorrect ? 'correct' : 'incorrect');
                // Set aria-invalid on all inputs for this question
                (q.inputs || []).forEach(function(inp) {
                    var el = document.getElementById(inp.id);
                    if (el) el.setAttribute('aria-invalid', qCorrect ? 'false' : 'true');
                });
                // Append format hint if any number input has a non-integer answer
                if (!qCorrect) {
                    var hasNonIntAnswer = numberInputs.some(function(n) {
                        return typeof n.answer === 'number' && n.answer % 1 !== 0;
                    });
                    if (hasNonIntAnswer) msg += ' (Accepted: whole numbers, fractions like 4/3, square roots like sqrt(5))';
                }
                fb.textContent = msg;
            }

            // Show hints on wrong answers; track attempt count for auto-rescue
            if (!qCorrect) {
                var hints = document.getElementById('hints-' + q.id);
                if (hints) hints.style.display = '';
                attemptCounts[q.id] = (attemptCounts[q.id] || 0) + 1;
                if (attemptCounts[q.id] >= 3) scheduleRescue(q.id, fb);
                // Post-wrong nudge: "Next up: Q[N+1]" after 2s (not on last question, not duplicate)
                var qIdx = examData.questions.indexOf(q);
                if (qIdx < examData.questions.length - 1) {
                    var hintContainer = document.getElementById('hints-' + q.id) || fb;
                    if (hintContainer && !hintContainer.querySelector('.wrong-nudge')) {
                        var nudge = document.createElement('p');
                        nudge.className = 'wrong-nudge';
                        nudge.textContent = 'Next up: Q' + (qIdx + 2);
                        nudge.setAttribute('aria-live', 'polite');
                        hintContainer.appendChild(nudge);
                        // Reduced motion: use JS timeout instead of CSS animation delay
                        var prefersReduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
                        if (prefersReduced) { nudge.style.opacity = '0'; setTimeout(function() { nudge.style.opacity = '1'; }, 2000); }
                        // Dismiss on scroll past question
                        var qBlock = document.getElementById('card-' + q.id);
                        if (qBlock && 'IntersectionObserver' in window) {
                            var nudgeIo = new IntersectionObserver(function(entries) {
                                entries.forEach(function(e) {
                                    if (!e.isIntersecting && nudge.parentNode) nudge.parentNode.removeChild(nudge);
                                });
                            }, { threshold: 0 });
                            nudgeIo.observe(qBlock);
                        }
                    }
                }
            } else {
                // Correct-answer pulse: green glow on each correct number input (ADHD dopamine signal)
                numberInputs.forEach(function(n) {
                    if (n.el) {
                        n.el.classList.add('correct-pulse');
                        n.el.addEventListener('animationend', function handler() {
                            n.el.classList.remove('correct-pulse');
                            n.el.removeEventListener('animationend', handler);
                        }, { once: true });
                    }
                });
            }
        });

        // == SECTION 5: Scorecard + Storage ==
        // Show scorecard
        showScorecard(score, total, stdScores, results);

        // Save to localStorage
        saveResults(score, total, results, stdScores);

        // Hide submit button
        document.getElementById('submitArea').style.display = 'none';

        // Scroll to scorecard
        document.getElementById('scorecard').scrollIntoView({ behavior: 'smooth' });
    }

    /**
     * Open a clean black-and-white print window.
     * Uses window.open() so dark theme, progress bar, and color never bleed in.
     * KaTeX already rendered in DOM — just clone it into a minimal white page.
     */
    function printExam() {
        if (!examData) return;
        var base = window.location.href.replace(/\/[^\/]*(\?.*)?$/, '/');

        // Unescape double-backslashes from JSON double-encoding
        function tex(s) {
            if (!s) return '';
            return s.replace(/\\\\/g, '\\');
        }

        // Build a printable box grid as an HTML table.
        // Corner is truly invisible: border:none on corner, border-left:none on first col header,
        // border-top:none on first row label. With border-collapse, those shared edges vanish.
        function boxGrid(cols, rows, showHeaders, renderTex) {
            var nCols = cols.length;
            var cellW = Math.max(80, Math.floor(360 / nCols));
            var cellH = 60;
            var hdrW = 80;
            var B = '2px solid #000';

            function td(w, h, bStyle, bg, content) {
                return '<td style="width:'+w+'px;height:'+h+'px;padding:4px;text-align:center;vertical-align:middle;'+bStyle+(bg?'background:'+bg+';':'')+'">'+content+'</td>';
            }

            var html = '<table style="border-collapse:collapse;margin:12px 0;">';

            // Header row: invisible corner + col headers
            html += '<tr>';
            html += td(hdrW, cellH, 'border:none;', null, ''); // corner — invisible
            cols.forEach(function(c, ci) {
                // First col header: no left border (shared edge with invisible corner)
                var bl = (ci === 0) ? 'none' : B;
                var bs = 'border-top:'+B+';border-right:'+B+';border-bottom:'+B+';border-left:'+bl+';';
                var label = (showHeaders && renderTex && c != null) ? renderTex(c) : '';
                var bg = (showHeaders && c != null) ? '#e8e8e8' : null;
                html += td(cellW, cellH, bs, bg, label);
            });
            html += '</tr>';

            // Data rows
            rows.forEach(function(r, ri) {
                html += '<tr>';
                // First row label: no top border on ri=0 (shared edge with invisible corner)
                var bt = (ri === 0) ? 'none' : B;
                var bs = 'border-top:'+bt+';border-right:'+B+';border-bottom:'+B+';border-left:'+B+';';
                var label = (showHeaders && renderTex) ? renderTex(r) : '';
                var bg = showHeaders ? '#e8e8e8' : null;
                html += td(hdrW, cellH, bs, bg, label);
                cols.forEach(function() {
                    html += td(cellW, cellH, 'border:'+B+';', null, '');
                });
                html += '</tr>';
            });

            html += '</table>';
            return html;
        }

        // Build a printable coordinate grid SVG.
        // withCurve=false: empty grid for Kai to plot points by hand.
        // withCurve=true: pre-drawn function curve for read-graph questions.
        function coordGrid(graphConfig, withCurve) {
            var sz = 280, ml = 32, mr = 12, mt = 12, mb = 28;
            var pw = sz - ml - mr, ph = sz - mt - mb;
            var step = pw / 32;
            var xAxisY = mt + ph / 2, yAxisX = ml + pw / 2;

            var s = '<svg xmlns="http://www.w3.org/2000/svg" width="' + sz + '" height="' + sz + '" style="display:block;margin:10px auto;">';
            s += '<rect width="' + sz + '" height="' + sz + '" fill="white" stroke="#999" stroke-width="1"/>';

            // Minor grid lines
            for (var i = 0; i <= 32; i++) {
                var gx = ml + i * step, gy = mt + i * step;
                s += '<line x1="' + gx.toFixed(1) + '" y1="' + mt + '" x2="' + gx.toFixed(1) + '" y2="' + (mt + ph) + '" stroke="#e0e0e0" stroke-width="0.5"/>';
                s += '<line x1="' + ml + '" y1="' + gy.toFixed(1) + '" x2="' + (ml + pw) + '" y2="' + gy.toFixed(1) + '" stroke="#e0e0e0" stroke-width="0.5"/>';
            }
            // Major grid lines every 5 units
            for (var n = -15; n <= 15; n += 5) {
                if (n === 0) continue;
                var mx = ml + (n + 16) * step, my = mt + (16 - n) * step;
                s += '<line x1="' + mx.toFixed(1) + '" y1="' + mt + '" x2="' + mx.toFixed(1) + '" y2="' + (mt + ph) + '" stroke="#bbb" stroke-width="0.8"/>';
                s += '<line x1="' + ml + '" y1="' + my.toFixed(1) + '" x2="' + (ml + pw) + '" y2="' + my.toFixed(1) + '" stroke="#bbb" stroke-width="0.8"/>';
            }
            // Axes
            s += '<line x1="' + ml + '" y1="' + xAxisY.toFixed(1) + '" x2="' + (ml + pw) + '" y2="' + xAxisY.toFixed(1) + '" stroke="#000" stroke-width="2"/>';
            s += '<line x1="' + yAxisX.toFixed(1) + '" y1="' + mt + '" x2="' + yAxisX.toFixed(1) + '" y2="' + (mt + ph) + '" stroke="#000" stroke-width="2"/>';
            // Axis labels
            for (var m = -15; m <= 15; m += 5) {
                if (m === 0) continue;
                var lx = ml + (m + 16) * step, ly = mt + (16 - m) * step;
                s += '<text x="' + lx.toFixed(1) + '" y="' + (xAxisY + 13).toFixed(1) + '" text-anchor="middle" font-size="7" font-family="Arial" fill="#000">' + m + '</text>';
                s += '<text x="' + (yAxisX - 5).toFixed(1) + '" y="' + (ly + 3).toFixed(1) + '" text-anchor="end" font-size="7" font-family="Arial" fill="#000">' + m + '</text>';
            }
            s += '<text x="' + (yAxisX + 4).toFixed(1) + '" y="' + (xAxisY + 13).toFixed(1) + '" font-size="7" font-family="Arial" fill="#000">0</text>';

            // Pre-draw function curve for read-graph questions
            if (withCurve && graphConfig && graphConfig.function) {
                try {
                    var fn = new Function('x', 'return ' + graphConfig.function);
                    var d = '', inSeg = false;
                    for (var gxi = -160; gxi <= 160; gxi++) {
                        var gxv = gxi / 10;
                        var fyv = fn(gxv);
                        if (!isFinite(fyv) || fyv < -16 || fyv > 16) { inSeg = false; continue; }
                        var px = (ml + ((gxv + 16) / 32) * pw).toFixed(1);
                        var py = (mt + ((-fyv + 16) / 32) * ph).toFixed(1);
                        if (!inSeg) { d += 'M ' + px + ' ' + py + ' '; inSeg = true; }
                        else { d += 'L ' + px + ' ' + py + ' '; }
                    }
                    if (d) s += '<path d="' + d + '" stroke="#222" stroke-width="2" fill="none" stroke-linejoin="round"/>';
                } catch(e) {}
            }
            s += '</svg>';
            return s;
        }

        var qHtml = examData.questions.map(function(q) {
            var inputHtml = '';

            // Grab already-rendered question text from the live DOM (KaTeX already ran here)
            var card = document.getElementById('card-' + q.id);
            var qtextEl = card ? card.querySelector('.question-text') : null;
            var renderedQText = qtextEl ? qtextEl.innerHTML : (q.question_html || '');

            // Helper: render a LaTeX string using the already-loaded katex instance
            function renderTex(s) {
                if (!s) return '';
                try { return katex.renderToString(s, { throwOnError: false, displayMode: false }); }
                catch(e) { return s; }
            }

            if (q.type === 'box' && q.box) {
                // All headers blank: Kai writes in the factor terms himself, then fills cells
                inputHtml = boxGrid(q.box.cols, q.box.rows, false, renderTex);
                inputHtml += '<div class="blank-row" style="margin-top:10px;"><span class="blank-lbl">Final Answer =</span><span class="blank-line"></span></div>';
            } else if (q.type === 'box-reverse' && q.box) {
                // Known factor shown on left; top headers blank (find the missing factor)
                var topCols = (q.box.partial_top || []).map(function(c) { return c || null; });
                inputHtml = boxGrid(topCols, q.box.known_factor, true, renderTex);
                inputHtml += '<div class="blank-row" style="margin-top:10px;"><span class="blank-lbl">Missing factor =</span><span class="blank-line"></span></div>';
            } else {
                // Graph questions: insert printable coordinate grid
                if (q.graph) {
                    var isReadOnly = !!q.graph.read_only;
                    inputHtml += coordGrid(q.graph, isReadOnly);
                }
                inputHtml += (q.inputs || []).map(function(inp) {
                    if (inp.type === 'radio') {
                        return '<div class="blank-row"><span class="blank-lbl">Answer</span><span class="blank-line"></span></div>';
                    }
                    return '<div class="blank-row"><span class="blank-lbl">' + (inp.label || 'Answer') + '</span><span class="blank-line"></span></div>';
                }).join('');
            }

            var workHeight = q.graph ? '60px' : '120px';
            return '<div class="qcard">' +
                '<div class="qhdr"><span class="qnum">Question ' + q.number + '</span><span class="qstd">' + q.standard + '</span></div>' +
                '<div class="qtext">' + renderedQText + '</div>' +
                inputHtml +
                '<div class="work-area" style="min-height:' + workHeight + ';"><span class="work-lbl">Show your work:</span></div>' +
                '</div>';
        }).join('');

        // Open print window directly — base href makes KaTeX font paths resolve correctly
        var w = window.open('', '_blank', 'width=820,height=1000');
        var html = [
            '<!DOCTYPE html><html><head><meta charset="UTF-8">',
            '<base href="' + base + '">',
            '<title>' + examData.title + '</title>',
            '<link rel="stylesheet" href="shared/katex/katex.min.css">',
            '<style>',
            'body{font-family:Arial,sans-serif;max-width:720px;margin:0 auto;padding:28px;background:#fff;color:#000;font-size:11pt;}',
            '*{-webkit-print-color-adjust:exact;print-color-adjust:exact;}',
            '.print-hd{text-align:center;border-bottom:2px solid #000;padding-bottom:10px;margin-bottom:6px;}',
            '.name-row{display:flex;gap:40px;margin:10px 0 20px;font-size:10pt;}',
            '.name-row span{flex:1;border-bottom:1px solid #000;padding-bottom:2px;}',
            '.qcard{border:1px solid #999;border-left:4px solid #000;padding:14px 16px;margin-bottom:18px;page-break-inside:avoid;}',
            '.qhdr{display:flex;align-items:center;gap:10px;border-bottom:1px solid #ccc;padding-bottom:6px;margin-bottom:10px;}',
            '.qnum{font-weight:800;font-size:1em;}',
            '.qstd{border:1px solid #999;border-radius:3px;padding:1px 6px;font-size:.78em;background:#f5f5f5;}',
            '.qtext{margin-bottom:10px;line-height:1.8;}',
            '.blank-row{display:flex;align-items:baseline;gap:8px;margin:8px 0;}',
            '.blank-lbl{white-space:nowrap;font-size:.9em;}',
            '.blank-line{flex:1;border-bottom:1.5px solid #000;min-width:120px;}',
            '.work-area{border:1px dashed #bbb;border-radius:3px;margin-top:10px;padding:6px 8px;}',
            '.work-lbl{font-size:.78em;color:#666;display:block;margin-bottom:4px;}',
            '* {color:#000!important;background:transparent!important;}',
            'body,p,div,span,td,th{background:#fff!important;}',
            '.katex *{background:transparent!important;}',
            '@page{margin:1.8cm;}',
            '@media print{.qcard{page-break-inside:avoid;}}',
            '</style>',
            '</head><body>',
            '<div class="print-hd"><strong>Motor City Math</strong><br>' + examData.title + '</div>',
            '<div class="name-row"><span>Name: &nbsp;</span><span>Date: &nbsp;</span><span>Period: &nbsp;</span></div>',
            qHtml,
            '<script>setTimeout(function(){window.print();},400);<\/script>',
            '</body></html>'
        ].join('');
        w.document.write(html);
        w.document.close();
    }

    /**
     * Send scores to Dad. Attempts blob download first, then always shows
     * a copy-paste modal so it works even when downloads are blocked.
     */
    /**
     * Publish Kai's scores to GitHub Pages via GitHub API.
     * Requires a classic PAT stored in localStorage under 'mcm_gh_pat'.
     * PAT needs repo scope (contents:write) on marcusash/motor-city-math.
     * Marcus sets this once on Kai's device via the setup prompt.
     */
    function publishScoresToGitHub(payload) {
        var pat = window.MCM_PAT || localStorage.getItem('mcm_gh_pat');
        if (!pat) return;
        if (!window.MCM_PAT) localStorage.setItem('mcm_gh_pat', pat.trim());
        var owner = 'marcusash', repo = 'motor-city-math';
        var examKey = 'mcm-' + (examData && examData.exam_id ? examData.exam_id : 'unknown');
        var scores = payload.mcm_scores || {};
        var scoreData = scores[examKey];
        if (!scoreData) return;

        // Per-file architecture: write scores/{key}.json (like batman-math)
        var fileData = { key: examKey, attempts: scoreData.attempts, best: scoreData.best };
        var filePath = 'scores/' + examKey + '.json';
        var apiBase = 'https://api.github.com/repos/' + owner + '/' + repo + '/contents/' + filePath;
        var headers = { 'Authorization': 'token ' + pat, 'Accept': 'application/vnd.github.v3+json', 'Content-Type': 'application/json' };
        var content = btoa(unescape(encodeURIComponent(JSON.stringify(fileData, null, 2))));

        // GET existing file SHA (needed for update; 404 means first write)
        fetch(apiBase, { headers: headers })
            .then(function(r) { return r.status === 404 ? null : r.json(); })
            .then(function(existing) {
                var body = { message: 'score: ' + examKey + ' ' + new Date().toISOString().slice(0,10), content: content };
                if (existing && existing.sha) body.sha = existing.sha;
                return fetch(apiBase, { method: 'PUT', headers: headers, body: JSON.stringify(body) });
            })
            .then(function(r) {
                if (r.ok) {
                    var banner = document.getElementById('ghPublishStatus');
                    if (banner) { banner.textContent = '✅ Published to Motor City Math — Dad can see your score now.'; banner.style.color = 'var(--color-correct, #3FB950)'; }
                } else {
                    return r.json().then(function(e) {
                        var banner = document.getElementById('ghPublishStatus');
                        if (banner) { banner.textContent = '⚠️ Publish failed: ' + (e.message || r.status) + '. Ask Dad to check the token.'; banner.style.color = 'var(--color-incorrect, #F85149)'; }
                        if (r.status === 401) localStorage.removeItem('mcm_gh_pat');
                    });
                }
            })
            .catch(function() {
                var banner = document.getElementById('ghPublishStatus');
                if (banner) { banner.textContent = '⚠️ Could not reach GitHub. Check your connection.'; banner.style.color = 'var(--color-incorrect, #F85149)'; }
            });
    }

    function sendToDad() {
        var scores = {};
        try { scores = JSON.parse(localStorage.getItem('mcm_scores') || '{}'); } catch(e) {}
        var srs = null;
        try { srs = JSON.parse(localStorage.getItem('mcm_srs') || 'null'); } catch(e) {}
        // Build readable summary for email body
        var examKey = 'mcm-' + (examData && examData.exam_id ? examData.exam_id : 'unknown');
        var examEntry = scores[examKey];
        var latestAttempt = examEntry && examEntry.attempts && examEntry.attempts.length > 0
            ? examEntry.attempts[examEntry.attempts.length - 1] : null;

        var payload = {
            version: 1,
            exported: new Date().toISOString(),
            student: 'Kai',
            mcm_scores: scores,
            mcm_srs: srs
        };
        var json = JSON.stringify(payload, null, 2);

        // Build plain-text email summary
        var emailSubject = 'MCM Results: ' + (examData ? examData.title : 'Quiz') + ' — ' + new Date().toLocaleDateString();
        var emailBody = 'Dad,\n\nHere are my results:\n\n';
        if (latestAttempt) {
            emailBody += 'Score: ' + latestAttempt.score + '/' + latestAttempt.total + ' (' + latestAttempt.pct + '%) — Grade ' + latestAttempt.grade + '\n';
            emailBody += 'Date: ' + new Date(latestAttempt.timestamp).toLocaleString() + '\n\n';
            emailBody += 'By Section:\n';
            Object.keys(latestAttempt.sections || {}).sort().forEach(function(sec) {
                var s = latestAttempt.sections[sec];
                emailBody += '  Section ' + sec + ': ' + s.score + '/' + s.total + '\n';
            });
            emailBody += '\nBy Question:\n';
            Object.keys(latestAttempt.questions || {}).forEach(function(qid) {
                var q = latestAttempt.questions[qid];
                emailBody += '  ' + qid + ' (' + q.standard + '): ' + (q.correct ? 'CORRECT' : 'WRONG') + '\n';
            });
        }
        emailBody += '\n--- Full JSON ---\n' + json;
        var mailtoHref = 'mailto:marcusash@outlook.com?subject=' + encodeURIComponent(emailSubject) + '&body=' + encodeURIComponent(emailBody);

        // Attempt download (may be silently blocked by browser or network policy)
        try {
            var blob = new Blob([json], { type: 'application/json' });
            var url = URL.createObjectURL(blob);
            var a = document.createElement('a');
            a.href = url;
            a.download = 'kai-scores-' + new Date().toISOString().slice(0, 10) + '.json';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            setTimeout(function() { URL.revokeObjectURL(url); }, 1000);
        } catch(e) {}

        // Publish to GitHub Pages so Dad sees live results
        publishScoresToGitHub(payload);

        // Always show modal with copy button — works even if download was blocked
        var modal = document.createElement('div');
        modal.id = 'sendDadModal';
        modal.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:9999;display:flex;align-items:center;justify-content:center;padding:16px;';
        modal.innerHTML =
            '<div style="background:var(--bg-card,#1e1e2e);border:1px solid var(--border-default,#444);border-radius:12px;padding:24px;width:100%;max-width:560px;display:flex;flex-direction:column;gap:14px;">' +
            '<h2 style="margin:0;color:var(--text-primary,#fff);font-size:1.1em;">Send to Dad</h2>' +
            '<p id="ghPublishStatus" style="margin:0;color:var(--text-secondary,#aaa);font-size:.9em;">Publishing to Motor City Math...</p>' +
            '<textarea id="_dadJson" readonly style="height:180px;font-family:monospace;font-size:.72em;background:#0d0d0d;color:#4ade80;border:1px solid #444;border-radius:6px;padding:10px;resize:none;width:100%;box-sizing:border-box;">' + json.replace(/&/g,'&amp;').replace(/</g,'&lt;') + '</textarea>' +
            '<div style="display:flex;gap:10px;">' +
            '<a id="_dadEmail" href="' + mailtoHref + '" style="flex:1;padding:12px;background:#4A90D9;color:#fff;border:none;border-radius:8px;font-weight:700;cursor:pointer;font-size:1em;text-align:center;text-decoration:none;display:flex;align-items:center;justify-content:center;">📧 Email to Dad</a>' +
            '<button id="_dadCopy" style="flex:1;padding:12px;background:#22c55e;color:#000;border:none;border-radius:8px;font-weight:700;cursor:pointer;font-size:1em;">Copy JSON</button>' +
            '<button onclick="document.getElementById(\'sendDadModal\').remove();" style="flex:1;padding:12px;background:#333;color:#fff;border:none;border-radius:8px;font-weight:700;cursor:pointer;font-size:1em;">Close</button>' +
            '</div></div>';
        document.body.appendChild(modal);

        document.getElementById('_dadCopy').addEventListener('click', function() {
            var ta = document.getElementById('_dadJson');
            ta.select();
            try {
                document.execCommand('copy');
                this.textContent = 'Copied!';
                this.style.background = '#16a34a';
            } catch(e) {
                this.textContent = 'Select all and copy manually';
            }
        });
    }

    /**
     * Render the scorecard UI after grading.
     * @param {number} score - Number of correct answers
     * @param {number} total - Total questions graded
     * @param {Object} stdScores - Per-standard score aggregates
     * @param {Array} results - Per-question result objects
     */
    function showScorecard(score, total, stdScores, results) {
        var pct = total > 0 ? Math.round((score / total) * 100) : 0;
        var grade = getGrade(pct);

        // Coach voice message based on grade
        var coachMsg = '';
        if (grade === 4) coachMsg = 'Grade 4. That\'s the standard. You earned it. 💪';
        else if (grade === 3) coachMsg = 'Almost there. A few more right and you\'re at Grade 4. 🏀';
        else if (grade === 2) coachMsg = 'Good start. Review the hints below and run it back. 🔄';
        else coachMsg = 'Rough one. Check the hints, study the gaps, then come back stronger. 💪';

        var html = '<div class="scorecard">';
        html += '<h2>You got ' + score + ' out of ' + total + '</h2>';
        html += '<div class="score-big" id="scoreBigEl">0%</div>';
        html += '<div class="saas-grade ' + gradeClass + '">Grade ' + grade + '</div>';
        html += '<p style="margin-top:12px; color:var(--text-secondary); font-size:var(--text-sm);">' + coachMsg + '</p>';

        // Always-visible: Send to Dad button right on scorecard
        html += '<div style="margin-top:14px;">';
        html += '<button class="nav-btn primary" onclick="sendToDad()" style="font-size:1em;padding:12px 28px;"><span aria-hidden="true">📧</span> Send to Dad</button>';
        html += '</div>';

        // Phase 1 CTA: See Your Game Plan (progressive disclosure)
        html += '<button id="gameplanBtn" class="btn-secondary" aria-expanded="false" onclick="revealGamePlan()"><span aria-hidden="true">📋</span> See Your Game Plan</button>';

        // Phase 2: hidden until button pressed
        html += '<div id="gamePlanSection" style="display:none;">';
        html += '<h3 style="margin-top:20px; color:var(--text-primary);">Your Game Plan</h3>';
        html += '<div class="standards-grid">';
        var stdKeys = Object.keys(stdScores).sort();
        if (stdKeys.length === 0) {
            html += '<p style="color:var(--text-secondary);font-size:var(--text-sm);">No breakdown available.</p>';
        } else {
            stdKeys.forEach(function(std) {
                var s = stdScores[std];
                var sPct = s.total > 0 ? Math.round((s.correct / s.total) * 100) : 0;
                var icon = sPct >= 85 ? '✅' : sPct >= 60 ? '🏀' : sPct > 0 ? '🎯' : '⬜';
                html += '<div class="std-card">';
                html += '<div class="std-name"><span aria-hidden="true">' + icon + '</span> ' + std + '</div>';
                html += '<div class="std-score">' + s.correct + '/' + s.total + ' (' + sPct + '%)</div>';
                html += '</div>';
            });
        }
        html += '</div>';

        // CTA: practice exams get score-based copy; real exams lock after grading
        var isRetake = examData && examData.exam_id && examData.exam_id.indexOf('retake') !== -1;
        if (!isRetake) {
            // Real exam: single forward-momentum CTA
            html += '<div style="margin-top:16px;"><a href="index.html" class="nav-btn primary" style="text-decoration:none;"><span aria-hidden="true">📊</span> See the Board</a></div>';
            html += '<div style="margin-top:10px;">';
            html += '<button class="nav-btn ghost" onclick="window.print()" style="margin-left:8px;"><span aria-hidden="true">🖨️</span> Print Results</button>';
            html += '</div>';
            if (grade < 3) {
                html += '<p style="margin-top:10px; color:var(--text-secondary); font-size:var(--text-sm);">Score locked. Study the hints above, then hit the practice tests. 💪</p>';
            }
        } else {
            // Practice exam: reload CTA copy based on score bracket
            var reloadLabel = pct >= 92 ? '<span aria-hidden="true">🔄</span> Defend Your Score' : pct >= 80 ? '<span aria-hidden="true">🔄</span> One More Run' : '<span aria-hidden="true">🔄</span> Run It Back';
            html += '<div style="margin-top:16px;"><a href="javascript:location.reload()" class="nav-btn primary" style="text-decoration:none;">' + reloadLabel + '</a>';
            html += ' <a href="index.html" class="nav-btn ghost" style="text-decoration:none; margin-left:8px;"><span aria-hidden="true">📊</span> See the Board</a></div>';
        }
        html += '</div>'; // end gamePlanSection
        html += '</div>';

        document.getElementById('scorecard').innerHTML = html;
        // Animate score reveal
        (function() {
            var el = document.getElementById('scoreBigEl');
            if (!el) return;
            var prefersReduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            if (prefersReduced) {
                el.textContent = pct + '%';
                if (pct >= 92) {
                    el.classList.add('grade-a-flash');
                    document.dispatchEvent(new CustomEvent('mcm:scoreReveal', { detail: { pct: pct, grade: grade } }));
                }
                return;
            }
            var start = null, dur = 600;
            function step(ts) {
                if (!start) start = ts;
                var prog = Math.min((ts - start) / dur, 1);
                el.textContent = Math.round(prog * pct) + '%';
                if (prog < 1) requestAnimationFrame(step);
                else {
                    el.textContent = pct + '%';
                    if (pct >= 92) {
                        el.classList.add('grade-a-flash');
                        document.dispatchEvent(new CustomEvent('mcm:scoreReveal', { detail: { pct: pct, grade: grade } }));
                    }
                }
            }
            requestAnimationFrame(step);
        })();
        document.getElementById('scorecard').style.display = '';
    }

    /**
     * Save exam results to localStorage under 'mcm_scores'.
     * Schema: mcm_scores[mcm-{exam_id}] = { attempts: [...], best: {score,pct,grade} }
     * Each attempt: { score, total, pct, grade, sections, questions, timestamp }
     */
    function saveResults(score, total, results, stdScores) {
        var pct = total > 0 ? Math.round((score / total) * 100) : 0;
        var grade = getGrade(pct);
        var storageKey = 'mcm-' + (examData.exam_id || 'unknown');

        // Build per-question results
        var qResults = {};
        examData.questions.forEach(function(q, i) {
            qResults[q.id] = { correct: results[i], type: q.type, standard: q.standard };
        });

        var attempt = {
            score: score, total: total, pct: pct, grade: grade,
            sections: {},
            questions: qResults,
            timestamp: new Date().toISOString()
        };

        // Build section scores
        examData.questions.forEach(function(q, i) {
            var sec = q.section;
            if (!attempt.sections[sec]) attempt.sections[sec] = { score: 0, total: 0 };
            attempt.sections[sec].total++;
            if (results[i]) attempt.sections[sec].score++;
        });

        try {
            var scores = JSON.parse(localStorage.getItem('mcm_scores') || '{}');
            if (!scores[storageKey]) scores[storageKey] = { attempts: [], best: null };
            // Real exams (not retake practice): lock after first attempt. Score of truth = first submission.
            var isRetakeExam = storageKey.indexOf('retake') !== -1;
            if (!isRetakeExam && scores[storageKey].attempts.length > 0) {
                return; // Score already recorded, do not overwrite
            }
            scores[storageKey].attempts.push(attempt);
            if (!scores[storageKey].best || pct > scores[storageKey].best.pct) {
                scores[storageKey].best = { score: score, pct: pct, grade: grade };
            }
            localStorage.setItem('mcm_scores', JSON.stringify(scores));
        } catch(e) {
            // State 6: localStorage unavailable or full — show inline note below scorecard
            var sc = document.getElementById('scorecard');
            if (sc && !document.getElementById('storage-fail-note')) {
                var note = document.createElement('p');
                note.id = 'storage-fail-note';
                note.style.cssText = 'font-size:var(--text-sm);color:var(--text-secondary);margin-top:12px;text-align:center';
                note.textContent = 'Score not saved (storage full). Screenshot this page.';
                sc.appendChild(note);
            }
        }

        // standardScores are now derived from attempts[].questions in the dashboard
        // Removed: additive accumulator that never reset, causing score inflation

        // LPM stub
        if (typeof MCM_LPM !== 'undefined' && MCM_LPM.recordResults) {
            try { MCM_LPM.recordResults(examData.exam_id, results, stdScores); } catch(e) {}
        }
    }
    </script>
</body>
</html>
