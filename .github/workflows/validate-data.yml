name: Validate Data Files

on:
  push:
    paths:
      - 'data/retake-practice-*.json'
      - 'data/manifest.json'
      - 'data/questions.json'
  pull_request:
    paths:
      - 'data/retake-practice-*.json'
      - 'data/manifest.json'

jobs:
  validate:
    name: Verify Practice Exams
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run exam verification
        run: node tests/verify-practice-exams.js

      - name: Run cross-exam verification
        run: node tests/cross-exam-verify.js

      - name: Run GP field completeness
        run: node tests/gp-field-completeness.test.js

      - name: Run GP feedback length (ADHD rule)
        run: node tests/gp-feedback-length.test.js

      - name: Run GP manifest integrity
        run: node tests/gp-manifest-integrity.test.js

      - name: Run GP answer uniqueness
        run: node tests/gp-answer-uniqueness.test.js
