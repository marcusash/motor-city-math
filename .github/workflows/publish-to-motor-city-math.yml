name: Publish to motor-city-math

on:
  push:
    branches: [master]
    paths:
      - 'index.html'
      - 'exam.html'
      - 'final_exam_251123.html'
      - 'final_exam_251123_mini.html'
      - 'nonlinear_exam_mvp.html'
      - 'shared/**'
      - 'data/**'
      - 'docs/**'
      - 'scripts/**'
      - '_gen.js'
      - 'package.json'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual publish'
        required: false
        default: 'Manual publish by GA'

jobs:
  publish:
    name: Sync to public motor-city-math
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kai-algebra2-tests
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

      - name: Clone motor-city-math
        env:
          MCM_TOKEN: ${{ secrets.MOTOR_CITY_MATH_TOKEN }}
        run: |
          git clone https://x-access-token:${MCM_TOKEN}@github.com/marcusash/motor-city-math.git /tmp/motor-city-math

      - name: Sync public files
        run: |
          # Files to sync to the public site
          PUBLIC_FILES=(
            "index.html"
            "exam.html"
            "final_exam_251123.html"
            "final_exam_251123_mini.html"
            "nonlinear_exam_pvp.html"
            "_gen.js"
            "package.json"
            "README.md"
          )
          PUBLIC_DIRS=(
            "shared"
            "data"
            "docs"
            "scripts"
          )

          # Copy individual files
          for f in "${PUBLIC_FILES[@]}"; do
            if [ -f "$f" ]; then
              cp "$f" /tmp/motor-city-math/"$f"
              echo "Synced: $f"
            fi
          done

          # Copy directories
          for d in "${PUBLIC_DIRS[@]}"; do
            if [ -d "$d" ]; then
              cp -r "$d" /tmp/motor-city-math/
              echo "Synced dir: $d"
            fi
          done

      - name: Commit and push to motor-city-math
        env:
          MCM_TOKEN: ${{ secrets.MOTOR_CITY_MATH_TOKEN }}
        run: |
          cd /tmp/motor-city-math
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to publish — motor-city-math is already up to date."
            exit 0
          fi
          COMMIT_MSG="${{ github.event.head_commit.message }}"
          if [ -z "$COMMIT_MSG" ]; then
            COMMIT_MSG="Manual publish: ${{ github.event.inputs.reason }}"
          fi
          git commit -m "sync: ${COMMIT_MSG}

Published from kai-algebra2-tests@${{ github.sha }}
Triggered by: ${{ github.actor }}"
          git push https://x-access-token:${MCM_TOKEN}@github.com/marcusash/motor-city-math.git master

      - name: Report publish URL
        run: |
          echo "Published to: https://marcusash.github.io/motor-city-math/"
          echo "Commit: ${{ github.sha }}"
