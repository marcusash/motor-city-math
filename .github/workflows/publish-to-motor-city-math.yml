name: Publish to motor-city-math

on:
  workflow_dispatch: # manual only — auto-trigger disabled until MOTOR_CITY_MATH_TOKEN is rotated

jobs:
  publish:
    name: Sync to motor-city-math
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Push to motor-city-math
        env:
          MCM_TOKEN: ${{ secrets.MOTOR_CITY_MATH_TOKEN }}
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          git clone https://x-access-token:${MCM_TOKEN}@github.com/marcusash/motor-city-math.git /tmp/mcm

          for f in index.html exam.html final_exam_251123.html final_exam_251123_mini.html nonlinear_exam_mvp.html _gen.js package.json README.md; do
            [ -f "$f" ] && cp "$f" /tmp/mcm/"$f" && echo "synced $f"
          done

          for d in shared data docs scripts; do
            [ -d "$d" ] && cp -r "$d" /tmp/mcm/ && echo "synced $d/"
          done

          cd /tmp/mcm
          git add -A
          if git diff --staged --quiet; then
            echo "Nothing to publish"
            exit 0
          fi
          git commit -m "sync from kai-algebra2-tests"
          git push https://x-access-token:${MCM_TOKEN}@github.com/marcusash/motor-city-math.git master
          echo "Published to https://marcusash.github.io/motor-city-math/"